<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Reader</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: Inter, sans-serif;
  background: var(--bg-app);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body { display: flex; flex-direction: column; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--line-soft);
  flex-shrink: 0;
}

.topbar-title {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 14px;
  color: var(--text-strong);
}

.topbar-actions { display: flex; gap: 16px; align-items: center; }

.toggle-switch {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}

.toggle-switch-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-muted);
  transition: color 0.2s ease;
}

.toggle-switch.active .toggle-switch-label {
  color: var(--text-primary);
}

.toggle-track {
  width: 36px;
  height: 20px;
  background: var(--toggle-track);
  border-radius: 10px;
  position: relative;
  transition: background 0.2s ease;
}

.toggle-switch.active .toggle-track {
  background: var(--toggle-track-active);
}

.toggle-thumb {
  width: 16px;
  height: 16px;
  background: #ffffff;
  border-radius: 50%;
  position: absolute;
  top: 2px;
  left: 2px;
  transition: transform 0.15s ease;
}

.toggle-switch.active .toggle-thumb {
  transform: translateX(16px);
}

.layout { display: flex; flex: 1; overflow: hidden; }

.sidebar {
  width: 280px;
  flex-shrink: 0;
  background: var(--bg-surface);
  border-right: 1px solid var(--line-soft);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px 8px;
}

.sidebar-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-accent);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.sort-btn {
  display: flex;
  align-items: center;
  gap: 3px;
  background: none;
  border: 1px solid var(--line-soft);
  border-radius: 6px;
  padding: 2px 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  cursor: pointer;
  transition: color 0.2s ease, border-color 0.2s ease;
}

.sort-btn:hover { color: var(--text-primary); border-color: var(--line-strong); }
.sort-icon { font-size: 12px; }

.doc-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 8px 16px;
  background: transparent;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background 0.2s ease;
}

.doc-item:hover { background: var(--bg-hover); }
.doc-item.active {
  width: calc(100% - 32px);
  margin: 0 16px;
  background: var(--bg-selected);
  font-weight: 700;
  color: var(--text-strong);
}
.doc-item-nested { padding-left: 28px; color: var(--text-accent); }
.doc-item-nested.active { color: var(--text-strong); }

.folder-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px 4px;
  margin-top: 12px;
  cursor: pointer;
  user-select: none;
  border-radius: 6px;
  transition: background 0.2s ease;
}

.folder-header:hover { background: var(--bg-hover); }
.folder-toggle { font-size: 10px; color: var(--text-muted); width: 10px; }

.folder-name {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-accent);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.main {
  flex: 1;
  padding: 32px 48px;
  overflow-y: auto;
  position: relative;
}

.content h1 { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 500; margin-bottom: 16px; color: var(--text-strong); }
.content h2 { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 500; margin-top: 32px; margin-bottom: 12px; color: var(--text-strong); }
.content h3 { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 500; margin-top: 24px; margin-bottom: 8px; color: var(--text-primary); }
.content h4 { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; margin-top: 16px; margin-bottom: 8px; color: var(--text-primary); }
.content p { font-family: Inter, sans-serif; font-size: 14px; line-height: 1.7; margin-bottom: 12px; }
.content ul, .content ol { font-size: 14px; line-height: 1.7; margin-bottom: 12px; padding-left: 24px; }
.content li { margin-bottom: 4px; }
.content a { color: var(--text-accent); text-decoration: none; transition: color 0.2s ease; }
.content a:hover { color: var(--text-primary); }
.content code { font-family: 'JetBrains Mono', monospace; font-size: 12px; background: var(--bg-hover); padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line-soft); color: var(--text-accent); }
.content pre { background: var(--bg-hover); padding: 16px; border-radius: 6px; overflow-x: auto; margin-bottom: 16px; border: 1px solid var(--line-soft); }
.content pre code { background: none; padding: 0; border: none; }
.content blockquote { border-left: 3px solid var(--line-strong); padding-left: 16px; color: var(--text-accent); margin-bottom: 12px; }
.content strong { font-weight: 700; }

.content table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 13px; line-height: 1.5; }
.content thead { position: sticky; top: 0; }
.content th { background: var(--text-strong); color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 12px; text-align: left; white-space: nowrap; }
.content td { padding: 8px 12px; border-bottom: 1px solid var(--line-soft); color: var(--text-primary); vertical-align: top; }
.content tbody tr:hover { background: var(--bg-hover); }
.content td code { font-size: 11px; padding: 2px 5px; }
.content td a { color: var(--text-accent); text-decoration: none; font-weight: 500; }
.content td a:hover { color: var(--text-strong); text-decoration: underline; }

.mermaid-container {
  background: var(--bg-surface);
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  padding: 24px;
  margin-bottom: 24px;
  overflow-x: auto;
  box-shadow: 0 1px 3px rgba(15, 38, 51, 0.04);
}

.mermaid-error {
  background: #fef2f2;
  border: 1px solid #fecaca;
  border-radius: 8px;
  padding: 24px;
  margin-bottom: 24px;
  color: #dc2626;
  font-size: 13px;
}

.empty-state {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
}

.toc {
  position: sticky;
  top: 0;
  float: right;
  margin-left: 16px;
  margin-bottom: 16px;
  width: 220px;
  max-height: calc(100vh - 120px);
  overflow-y: auto;
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  background: var(--bg-surface);
  padding: 16px 20px;
  z-index: 10;
  box-shadow: 0 4px 12px rgba(15, 38, 51, 0.06);
}

.toc-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 12px;
}

.toc a {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--text-accent);
  text-decoration: none;
  padding: 4px 0;
}

.toc a:hover { color: var(--text-primary); }
.toc-list { list-style: none; padding: 0; }
.toc-h1 { font-weight: 700; }
.toc-h2 { padding-left: 0; }
.toc-h3 { padding-left: 16px; }
.toc-h4 { padding-left: 32px; }

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 38, 51, 0.5);
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.modal {
  background: var(--bg-surface);
  border-radius: 12px;
  max-width: 90vw;
  max-height: 90vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(15, 38, 51, 0.2);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  border-bottom: 1px solid var(--line-soft);
}

.modal-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-strong);
}

.modal-close {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: var(--text-muted);
  line-height: 1;
  transition: color 0.2s ease;
}

.modal-close:hover { color: var(--text-primary); }

.modal-body {
  padding: 24px;
  overflow-y: auto;
  flex: 1;
}

:root {
  --bg-app: #f8fafb;
  --bg-surface: #ffffff;
  --bg-hover: #f0f3f7;
  --bg-selected: #e1e8f0;
  --line-soft: #e1e8f0;
  --line-strong: #c3d6e2;
  --text-strong: #0f2633;
  --text-primary: #1a3a47;
  --text-accent: #5a8fa3;
  --text-muted: #8db4c0;
  --toggle-track: #d2dfe9;
  --toggle-track-active: #5a8fa3;
}

  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-title">Document Reader</div>
    <div class="topbar-actions">
      <div class="toggle-switch" id="btn-toc" onclick="toggleToc()">
        <span class="toggle-switch-label">TOC</span>
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
      </div>
      <div class="toggle-switch" id="btn-diagrams" onclick="toggleDiagrams()">
        <span class="toggle-switch-label">Diagrams</span>
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
      </div>
    </div>
  </div>
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-label">Documents</div>
        <button class="sort-btn" onclick="toggleSort()" title="Toggle sort order">
          <span class="sort-icon">&#x21C5;</span> <span id="sort-label">Modified</span>
        </button>
      </div>
      <div id="doc-list"></div>
    </nav>
    <main class="main" id="main-content">
      <div class="empty-state">Select a document to begin</div>
    </main>
  </div>
  <div class="modal-overlay" id="modal" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title" id="modal-title"></div>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

const DOCUMENTS = [{"filename":"design-pipeline.html","content":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>CorePVS Design Pipeline v3.1<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root {\n    --bg:        #F5F0E8;\n    --surface:   #FDFAF5;\n    --ink:       #1A1A1A;\n    --forest:    #1E4D2B;\n    --forest2:   #4A7C59;\n    --sage:      #8AAF7E;\n    --olive:     #A3B899;\n    --bluegrey:  #B8C9D4;\n    --border:    #2A2A2A;\n    --border-lt: #C8C0B0;\n    --muted:     #6A6A5A;\n    --done-bg:   #EEF5EC;\n    --done-border: #4A7C59;\n    --done-acc:  #1E4D2B;\n    --wip-bg:    #F5F2E8;\n    --wip-border:#A3905A;\n    --wip-acc:   #7A5A18;\n    --todo-bg:   #F5F0E8;\n  }\n\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  body {\n    background: var(--bg);\n    color: var(--ink);\n    font-family: 'Inter', sans-serif;\n    font-size: 13px;\n    line-height: 1.55;\n    min-height: 100vh;\n  }\n\n  .page { max-width: 1180px; margin: 0 auto; padding: 52px 48px 96px; }\n\n  /* ── TOP NAV BAR ── */\n  .topbar {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    padding-bottom: 24px;\n    border-bottom: 2px solid var(--forest);\n    margin-bottom: 48px;\n    gap: 24px;\n    flex-wrap: wrap;\n  }\n  .brand-row { display: flex; align-items: center; gap: 10px; }\n  .brand-icon {\n    width: 26px; height: 26px;\n    background: var(--forest);\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    grid-template-rows: 1fr 1fr;\n    gap: 2px;\n    padding: 4px;\n  }\n  .brand-icon span { background: #fff; display: block; }\n  .brand-icon span:nth-child(2) { background: rgba(255,255,255,.4); }\n  .brand-name {\n    font-family: 'DM Mono', monospace;\n    font-size: 11px;\n    letter-spacing: .22em;\n    text-transform: uppercase;\n    color: var(--forest);\n    font-weight: 500;\n  }\n  .header-stats {\n    display: flex;\n    gap: 0;\n    border: 1px solid var(--border);\n    border-radius: 6px;\n    overflow: hidden;\n    align-self: center;\n    margin-top: 0;\n  }\n  .stat-block {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    padding: 8px 12px;\n    border-right: 1px solid var(--border-lt);\n    background: var(--surface);\n    min-width: 44px;\n  }\n  .stat-block:last-child { border-right: none; }\n  .stat-num {\n    font-family: 'Playfair Display', serif;\n    font-size: 14px;\n    font-weight: 700;\n    color: var(--forest);\n    line-height: 1;\n    margin-bottom: 2px;\n  }\n  .stat-label {\n    font-family: 'DM Mono', monospace;\n    font-size: 7px;\n    color: var(--muted);\n    letter-spacing: .08em;\n    text-transform: uppercase;\n  }\n\n  /* ── SECTION LABEL ── */\n  .section-label {\n    font-family: 'DM Mono', monospace;\n    font-size: 9px;\n    letter-spacing: .24em;\n    text-transform: uppercase;\n    color: var(--muted);\n    margin-bottom: 16px;\n    display: flex;\n    align-items: center;\n    gap: 12px;\n  }\n  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border-lt); }\n\n  /* ── PIPELINE ── */\n  .pipeline-wrap { margin-bottom: 52px; }\n  .pipeline { display: flex; align-items: stretch; gap: 8px; }\n\n  .phase-block { display: flex; flex-direction: column; flex: 1; }\n\n  .pipeline-steps {\n    display: flex;\n    align-items: center;\n    flex: 1;\n    background: var(--surface);\n    border: 1.5px solid var(--border);\n    border-radius: 8px;\n    padding: 20px 16px;\n    gap: 0;\n  }\n\n  .p-step {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    flex: 1;\n    position: relative;\n    padding: 0 10px;\n    text-align: center;\n  }\n  .p-step::after {\n    content: '→';\n    position: absolute;\n    right: -8px;\n    top: 36%;\n    color: var(--border-lt);\n    font-size: 14px;\n  }\n  .p-step:last-child::after { display: none; }\n\n  .step-num {\n    width: 32px; height: 32px;\n    display: flex; align-items: center; justify-content: center;\n    font-family: 'DM Mono', monospace;\n    font-size: 11px;\n    font-weight: 500;\n    color: var(--surface);\n    margin-bottom: 8px;\n    background: var(--ink);\n    border-radius: 50%;\n    letter-spacing: .03em;\n  }\n  .phase-block:last-child .p-step .step-num {\n    background: var(--forest);\n  }\n\n  .step-name { font-size: 12px; font-weight: 600; color: var(--ink); line-height: 1.3; }\n  .step-scope {\n    font-family: 'DM Mono', monospace;\n    font-size: 9px;\n    color: var(--muted);\n    margin-top: 3px;\n    letter-spacing: .04em;\n  }\n\n  .phase-sep {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    width: 24px;\n    color: var(--forest2);\n    font-size: 20px;\n    padding-top: 22px;\n    flex-shrink: 0;\n  }\n\n  .loop-note {\n    font-family: 'DM Mono', monospace;\n    font-size: 9px;\n    color: var(--muted);\n    text-align: right;\n    margin-top: 10px;\n    letter-spacing: .06em;\n  }\n  .loop-note::before { content: '↻  '; color: var(--forest); }\n\n  /* ── KANBAN ── */\n  .kanban-section { margin-top: 0; }\n  .kanban-grid {\n    display: flex;\n    flex-direction: row;\n    align-items: stretch;\n    flex-wrap: nowrap;\n    gap: 8px;\n    overflow-x: auto;\n  }\n\n  .kanban-row {\n    display: flex;\n    flex-direction: column;\n    align-items: stretch;\n    border: 1.5px solid var(--border);\n    border-radius: 8px;\n    overflow: hidden;\n    background: var(--surface);\n    flex: 1 1 0;\n    min-width: 210px;\n  }\n\n  .col-header {\n    font-family: 'DM Mono', monospace;\n    font-size: 9px;\n    letter-spacing: .18em;\n    text-transform: uppercase;\n    display: flex;\n    flex-direction: row;\n    justify-content: space-between;\n    align-items: center;\n    width: 100%;\n    padding: 12px 14px;\n    background: var(--forest);\n    color: rgba(255,255,255,.6);\n  }\n  .col-header.wip-col  { background: var(--ink); }\n  .col-header.todo-col { background: var(--muted); }\n\n  .col-label { font-size: 9px; letter-spacing: .18em; margin-bottom: 0; color: rgba(255,255,255,.55); }\n  .col-count {\n    font-family: 'Playfair Display', serif;\n    font-size: 22px;\n    font-weight: 700;\n    color: #fff;\n    line-height: 1;\n  }\n\n  .cards-row {\n    display: flex;\n    flex-direction: column;\n    gap: 10px;\n    flex: 1 1 auto;\n    padding: 12px;\n    align-items: stretch;\n  }\n\n  .card {\n    padding: 12px 14px;\n    border: 1.5px solid var(--border);\n    border-radius: 8px;\n    position: relative;\n    width: 100%;\n    flex: 1 1 auto;\n    background: #fff;\n  }\n  .card.done { background: var(--done-bg); border-color: var(--done-border); }\n  .card.wip  { background: var(--wip-bg);  border-color: var(--wip-border); }\n  .card.todo { background: var(--todo-bg); border-color: var(--border-lt); }\n\n  .card-step {\n    font-family: 'DM Mono', monospace;\n    font-size: 8px;\n    letter-spacing: .14em;\n    text-transform: uppercase;\n    margin-bottom: 10px;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 8px;\n    color: var(--muted);\n  }\n  .step-pip { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }\n  .card-code {\n    font-family: 'DM Mono', monospace;\n    font-size: 9px;\n    color: var(--muted);\n    display: flex;\n    align-items: center;\n    gap: 6px;\n  }\n  .card-state {\n    font-family: 'DM Mono', monospace;\n    font-size: 8px;\n    letter-spacing: .14em;\n    font-weight: 500;\n    text-transform: uppercase;\n    color: var(--muted);\n  }\n  .card-title { font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 4px; line-height: 1.3; }\n  .card-subtitle {\n    font-family: 'DM Mono', monospace;\n    font-size: 9px;\n    color: var(--muted);\n    letter-spacing: .04em;\n  }\n  .card.done .card-state { color: var(--done-acc); }\n  .card.wip .card-state { color: var(--wip-acc); }\n  .card.todo .card-state { color: var(--muted); }\n\n  /* ── LEGEND ── */\n  .legend {\n    margin-top: 36px;\n    padding-top: 20px;\n    border-top: 1px solid var(--border-lt);\n    display: flex;\n    gap: 24px;\n    flex-wrap: wrap;\n    align-items: center;\n  }\n  .legend-label { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }\n  .legend-item { display: flex; align-items: center; gap: 6px; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: .04em; }\n  .legend-pip { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }\n\n  @media (max-width: 820px) {\n    .kanban-grid { flex-direction: column; overflow-x: visible; }\n    .kanban-row { flex-direction: column; }\n    .col-header { width: 100%; flex-direction: row; align-items: center; padding: 12px 16px; }\n    .col-count { font-size: 22px; }\n    .pipeline { flex-direction: column; }\n    .page { padding: 36px 20px 72px; }\n    .card { width: 100%; }\n    .header-stats { flex-wrap: wrap; }\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n\n  <!-- TOP NAV BAR -->\n  <div class=\"topbar\">\n    <div class=\"brand-row\">\n      <div class=\"brand-icon\"><span><\/span><span><\/span><span><\/span><span><\/span><\/div>\n      <div class=\"brand-name\">CorePVS<\/div>\n    <\/div>\n    <div class=\"header-stats\">\n      <div class=\"stat-block\">\n        <div class=\"stat-num\">5<\/div>\n        <div class=\"stat-label\">Pipeline Steps<\/div>\n      <\/div>\n      <div class=\"stat-block\">\n        <div class=\"stat-num\">1<\/div>\n        <div class=\"stat-label\">Reference Flow<\/div>\n      <\/div>\n      <div class=\"stat-block\">\n        <div class=\"stat-num\">1<\/div>\n        <div class=\"stat-label\">Compliance Inventory<
