<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Reader</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: Inter, sans-serif;
  background: var(--bg-app);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body { display: flex; flex-direction: column; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--line-soft);
  flex-shrink: 0;
}

.topbar-title {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 14px;
  color: var(--text-strong);
}

.topbar-actions { display: flex; gap: 16px; align-items: center; }

.toggle-switch {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}

.toggle-switch-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-muted);
  transition: color 0.2s ease;
}

.toggle-switch.active .toggle-switch-label {
  color: var(--text-primary);
}

.toggle-track {
  width: 36px;
  height: 20px;
  background: var(--toggle-track);
  border-radius: 10px;
  position: relative;
  transition: background 0.2s ease;
}

.toggle-switch.active .toggle-track {
  background: var(--toggle-track-active);
}

.toggle-thumb {
  width: 16px;
  height: 16px;
  background: #ffffff;
  border-radius: 50%;
  position: absolute;
  top: 2px;
  left: 2px;
  transition: transform 0.15s ease;
}

.toggle-switch.active .toggle-thumb {
  transform: translateX(16px);
}

.layout { display: flex; flex: 1; overflow: hidden; }

.sidebar {
  width: 280px;
  flex-shrink: 0;
  background: var(--bg-surface);
  border-right: 1px solid var(--line-soft);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.sidebar-list {
  flex: 1 1 auto;
  overflow-y: auto;
  padding-bottom: 16px;
}

.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px 8px;
}

.sidebar-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-accent);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.sort-btn {
  display: flex;
  align-items: center;
  gap: 3px;
  background: none;
  border: 1px solid var(--line-soft);
  border-radius: 6px;
  padding: 2px 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  cursor: pointer;
  transition: color 0.2s ease, border-color 0.2s ease;
}

.sort-btn:hover { color: var(--text-primary); border-color: var(--line-strong); }
.sort-icon { font-size: 12px; }

.sidebar-footer {
  flex-shrink: 0;
  padding: 12px 16px 16px;
  border-top: 1px solid var(--line-soft);
  background: var(--bg-surface);
}

.doc-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 8px 16px;
  background: transparent;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background 0.2s ease;
}

.doc-item:hover { background: var(--bg-hover); }
.doc-item.active {
  width: calc(100% - 32px);
  margin: 0 16px;
  background: var(--bg-selected);
  font-weight: 700;
  color: var(--text-strong);
}
.doc-item-footer {
  width: 100%;
  margin: 0;
  padding: 10px 12px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: var(--bg-surface);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
}
.doc-item-footer:hover {
  background: var(--bg-hover);
  border-color: var(--text-accent);
}
.doc-item-footer.active {
  width: 100%;
  margin: 0;
  background: var(--bg-selected);
  border-color: var(--text-accent);
}
.doc-item-nested { padding-left: 28px; color: var(--text-accent); }
.doc-item-nested.active { color: var(--text-strong); }

.folder-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px 4px;
  margin-top: 12px;
  cursor: pointer;
  user-select: none;
  border-radius: 6px;
  transition: background 0.2s ease;
}

.folder-header:hover { background: var(--bg-hover); }
.folder-toggle { font-size: 10px; color: var(--text-muted); width: 10px; }

.folder-name {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-accent);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.main {
  flex: 1;
  padding: 32px 48px;
  overflow-y: auto;
  position: relative;
}

.content h1 { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 500; margin-bottom: 16px; color: var(--text-strong); }
.content h2 { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 500; margin-top: 32px; margin-bottom: 12px; color: var(--text-strong); }
.content h3 { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 500; margin-top: 24px; margin-bottom: 8px; color: var(--text-primary); }
.content h4 { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; margin-top: 16px; margin-bottom: 8px; color: var(--text-primary); }
.content p { font-family: Inter, sans-serif; font-size: 14px; line-height: 1.7; margin-bottom: 12px; }
.content ul, .content ol { font-size: 14px; line-height: 1.7; margin-bottom: 12px; padding-left: 24px; }
.content li { margin-bottom: 4px; }
.content a { color: var(--text-accent); text-decoration: none; transition: color 0.2s ease; }
.content a:hover { color: var(--text-primary); }
.content code { font-family: 'JetBrains Mono', monospace; font-size: 12px; background: var(--bg-hover); padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line-strong); color: var(--text-strong); }
.content pre { background: var(--bg-hover); padding: 16px; border-radius: 6px; overflow-x: auto; margin-bottom: 16px; border: 1px solid var(--line-soft); }
.content pre code { background: none; padding: 0; border: none; color: inherit; }
.content blockquote { border-left: 3px solid var(--line-strong); padding-left: 16px; color: var(--text-accent); margin-bottom: 12px; }
.content strong { font-weight: 700; }

.content table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 13px; line-height: 1.5; }
.content thead { position: sticky; top: 0; }
.content th { background: var(--text-strong); color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 12px; text-align: left; white-space: nowrap; }
.content td { padding: 8px 12px; border-bottom: 1px solid var(--line-soft); color: var(--text-primary); vertical-align: top; }
.content tbody tr:hover { background: var(--bg-hover); }
.content td code { font-size: 11px; padding: 2px 5px; }
.content td a { color: var(--text-accent); text-decoration: none; font-weight: 500; }
.content td a:hover { color: var(--text-strong); text-decoration: underline; }

.mermaid-container {
  background: var(--bg-surface);
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  padding: 24px;
  margin-bottom: 24px;
  overflow-x: auto;
  box-shadow: 0 1px 3px rgba(15, 38, 51, 0.04);
}

.mermaid-error {
  background: #fef2f2;
  border: 1px solid #fecaca;
  border-radius: 8px;
  padding: 24px;
  margin-bottom: 24px;
  color: #dc2626;
  font-size: 13px;
}

.empty-state {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
}

.toc {
  position: sticky;
  top: 0;
  float: right;
  margin-left: 16px;
  margin-bottom: 16px;
  width: 220px;
  max-height: calc(100vh - 120px);
  overflow-y: auto;
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  background: var(--bg-surface);
  padding: 16px 20px;
  z-index: 10;
  box-shadow: 0 4px 12px rgba(15, 38, 51, 0.06);
}

.toc-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 12px;
}

.toc a {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--text-accent);
  text-decoration: none;
  padding: 4px 0;
}

.toc a:hover { color: var(--text-primary); }
.toc-list { list-style: none; padding: 0; }
.toc-h1 { font-weight: 700; }
.toc-h2 { padding-left: 0; }
.toc-h3 { padding-left: 16px; }
.toc-h4 { padding-left: 32px; }

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 38, 51, 0.5);
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.modal {
  background: var(--bg-surface);
  border-radius: 12px;
  max-width: 90vw;
  max-height: 90vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(15, 38, 51, 0.2);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  border-bottom: 1px solid var(--line-soft);
}

.modal-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-strong);
}

.modal-close {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: var(--text-muted);
  line-height: 1;
  transition: color 0.2s ease;
}

.modal-close:hover { color: var(--text-primary); }

.modal-body {
  padding: 24px;
  overflow-y: auto;
  flex: 1;
}

:root {
  --bg-app: #f6f1e8;
  --bg-surface: #fffaf2;
  --bg-hover: #f2eadf;
  --bg-selected: #e9decd;
  --line-soft: #e3d7c7;
  --line-strong: #cdbba6;
  --text-strong: #0f2633;
  --text-primary: #1a3a47;
  --text-accent: #5a8fa3;
  --text-muted: #8db4c0;
  --toggle-track: #d9cbbb;
  --toggle-track-active: #5a8fa3;
}

  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-title">Document Reader</div>
    <div class="topbar-actions">
      <div class="toggle-switch" id="btn-toc" onclick="toggleToc()">
        <span class="toggle-switch-label">TOC</span>
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
      </div>
      <div class="toggle-switch" id="btn-diagrams" onclick="toggleDiagrams()">
        <span class="toggle-switch-label">Diagrams</span>
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
      </div>
    </div>
  </div>
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-label">Sort by</div>
        <button class="sort-btn" onclick="toggleSort()" title="Toggle sort order">
          <span class="sort-icon">&#x21C5;</span> <span id="sort-label">Modified</span>
        </button>
      </div>
      <div id="doc-list" class="sidebar-list"></div>
      <div id="sidebar-footer" class="sidebar-footer"></div>
    </nav>
    <main class="main" id="main-content">
      <div class="empty-state">Select a document to begin</div>
    </main>
  </div>
  <div class="modal-overlay" id="modal" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title" id="modal-title"></div>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>

const DOCUMENTS = [{"filename":"design-pipeline.html","content":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>CorePVS Design Pipeline v3.1<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root {\n    --bg:        #F5F0E8;\n    --surface:   #FDFAF5;\n    --ink:       #1A1A1A;\n    --forest:    #1E4D2B;\n    --forest2:   #4A7C59;\n    --sage:      #8AAF7E;\n    --olive:     #A3B899;\n    --bluegrey:  #B8C9D4;\n    --border:    #2A2A2A;\n    --border-lt: #C8C0B0;\n    --muted:     #6A6A5A;\n    --done-bg:   #EEF5EC;\n    --done-border: #4A7C59;\n    --done-acc:  #1E4D2B;\n    --wip-bg:    #F5F2E8;\n    --wip-border:#A3905A;\n    --wip-acc:   #7A5A18;\n    --todo-bg:   #F5F0E8;\n  }\n\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  body {\n    background: var(--bg);\n    color: var(--ink);\n    font-family: 'Inter', sans-serif;\n    font-size: 13px;\n    line-height: 1.55;\n    min-height: 100vh;\n  }\n\n  .page { max-width: 1180px; margin: 0 auto; padding: 52px 48px 96px; }\n\n  /* ── TOP NAV BAR ── */\n  .topbar {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    padding-bottom: 24px;\n    border-bottom: 2px solid var(--forest);\n    margin-bottom: 48px;\n    gap: 24px;\n    flex-wrap: wrap;\n  }\n  .brand-row { display: flex; align-items: center; gap: 10px; }\n  .brand-icon {\n    width: 26px; height: 26px;\n    background: var(--forest);\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    grid-template-rows: 1fr 1fr;\n    gap: 2px;\n    padding: 4px;\n  }\n  .brand-icon span { background: #fff; display: block; }\n  .brand-icon span:nth-child(2) { background: rgba(255,255,255,.4); }\n  .brand-name {\n    font-family: 'DM Mono', monospace;\n    font-size: 11px;\n    letter-spacing: .22em;\n    text-transform: uppercase;\n    color: var(--forest);\n    font-weight: 500;\n  }\n  .header-stats {\n    display: flex;\n    gap: 0;\n    border: 1px solid var(--border);\n    border-radius: 6px;\n    overflow: hidden;\n    align-self: center;\n    margin-top: 0;\n  }\n  .stat-block {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    padding: 8px 12px;\n    border-right: 1px solid var(--border-lt);\n    background: var(--surface);\n    min-width: 44px;\n  }\n  .stat-block:last-child { border-right: none; }\n  .stat-num {\n    font-family: 'Playfair Display', serif;\n    font-size: 14px;\n    font-weight: 700;\n    color: var(--forest);\n    line-height: 1;\n    margin-bottom: 2px;\n  }\n  .stat-label {\n    font-family: 'DM Mono', monospace;\n    font-size: 7px;\n    color: var(--muted);\n    letter-spacing: .08em;\n    text-transform: uppercase;\n  }\n\n  /* ── SECTION LABEL ── */\n  .section-label {\n    font-family: 'DM Mono', monospace;\n    font-size: 9px;\n    letter-spacing: .24em;\n    text-transform: uppercase;\n    color: var(--muted);\n    margin-bottom: 16px;\n    display: flex;\n    align-items: center;\n    gap: 12px;\n  }\n  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border-lt); }\n\n  /* ── PIPELINE ── */\n  .pipeline-wrap { margin-bottom: 52px; }\n  .pipeline { display: flex; align-items: stretch; gap: 8px; }\n\n  .phase-block { display: flex; flex-direction: column; flex: 1; }\n\n  .pipeline-steps {\n    display: flex;\n    align-items: center;\n    flex: 1;\n    background: var(--surface);\n    border: 1.5px solid var(--border);\n    border-radius: 8px;\n    padding: 20px 16px;\n    gap: 0;\n  }\n\n  .p-step {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    flex: 1;\n    position: relative;\n    padding: 0 10px;\n    text-align: center;\n  }\n  .p-step::after {\n    content: '→';\n    position: absolute;\n    right: -8px;\n    top: 36%;\n    color: var(--border-lt);\n    font-size: 14px;\n  }\n  .p-step:last-child::after { display: none; }\n\n  .step-num {\n    width: 32px; height: 32px;\n    display: flex; align-items: center; justify-content: center;\n    font-family: 'DM Mono', monospace;\n    font-size: 11px;\n    font-weight: 500;\n    color: var(--surface);\n    margin-bottom: 8px;\n    background: var(--ink);\n    border-radius: 50%;\n    letter-spacing: .03em;\n  }\n  .phase-block:last-child .p-step .step-num {\n    background: var(--forest);\n  }\n\n  .step-name { font-size: 12px; font-weight: 600; color: var(--ink); line-height: 1.3; }\n  .step-scope {\n    font-family: 'DM Mono', monospace;\n    font-size: 9px;\n    color: var(--muted);\n    margin-top: 3px;\n    letter-spacing: .04em;\n  }\n\n  .phase-sep {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    width: 24px;\n    color: var(--forest2);\n    font-size: 20px;\n    padding-top: 22px;\n    flex-shrink: 0;\n  }\n\n  .loop-note {\n    font-family: 'DM Mono', monospace;\n    font-size: 9px;\n    color: var(--muted);\n    text-align: right;\n    margin-top: 10px;\n    letter-spacing: .06em;\n  }\n  .loop-note::before { content: '↻  '; color: var(--forest); }\n\n  /* ── KANBAN ── */\n  .kanban-section { margin-top: 0; }\n  .kanban-grid {\n    display: flex;\n    flex-direction: row;\n    align-items: stretch;\n    flex-wrap: nowrap;\n    gap: 8px;\n    overflow-x: auto;\n  }\n\n  .kanban-row {\n    display: flex;\n    flex-direction: column;\n    align-items: stretch;\n    border: 1.5px solid var(--border);\n    border-radius: 8px;\n    overflow: hidden;\n    background: var(--surface);\n    flex: 1 1 0;\n    min-width: 210px;\n  }\n\n  .col-header {\n    font-family: 'DM Mono', monospace;\n    font-size: 9px;\n    letter-spacing: .18em;\n    text-transform: uppercase;\n    display: flex;\n    flex-direction: row;\n    justify-content: space-between;\n    align-items: center;\n    width: 100%;\n    padding: 12px 14px;\n    background: var(--forest);\n    color: rgba(255,255,255,.6);\n  }\n  .col-header.wip-col  { background: var(--ink); }\n  .col-header.todo-col { background: var(--muted); }\n\n  .col-label { font-size: 9px; letter-spacing: .18em; margin-bottom: 0; color: rgba(255,255,255,.55); }\n  .col-count {\n    font-family: 'Playfair Display', serif;\n    font-size: 22px;\n    font-weight: 700;\n    color: #fff;\n    line-height: 1;\n  }\n\n  .cards-row {\n    display: flex;\n    flex-direction: column;\n    gap: 10px;\n    flex: 1 1 auto;\n    padding: 12px;\n    align-items: stretch;\n  }\n\n  .card {\n    padding: 12px 14px;\n    border: 1.5px solid var(--border);\n    border-radius: 8px;\n    position: relative;\n    width: 100%;\n    flex: 0 0 auto;\n    background: #fff;\n    display: flex;\n    flex-direction: column;\n  }\n  .card.done { background: var(--done-bg); border-color: var(--done-border); }\n  .card.wip  { background: var(--wip-bg);  border-color: var(--wip-border); }\n  .card.todo { background: var(--todo-bg); border-color: var(--border-lt); }\n\n  .card-step {\n    font-family: 'DM Mono', monospace;\n    font-size: 8px;\n    letter-spacing: .14em;\n    text-transform: uppercase;\n    margin-bottom: 10px;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 8px;\n    color: var(--muted);\n  }\n  .step-pip { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }\n  .card-code {\n    font-family: 'DM Mono', monospace;\n    font-size: 9px;\n    color: var(--muted);\n    display: flex;\n    align-items: center;\n    gap: 6px;\n  }\n  .card-state {\n    font-family: 'DM Mono', monospace;\n    font-size: 8px;\n    letter-spacing: .14em;\n    font-weight: 500;\n    text-transform: uppercase;\n    color: var(--muted);\n  }\n  .card-title { font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 4px; line-height: 1.3; }\n  .card-subtitle {\n    font-family: 'DM Mono', monospace;\n    font-size: 9px;\n    color: var(--muted);\n    letter-spacing: .04em;\n  }\n  .card.done .card-state { color: var(--done-acc); }\n  .card.wip .card-state { color: var(--wip-acc); }\n  .card.todo .card-state { color: var(--muted); }\n\n  /* ── LEGEND ── */\n  .legend {\n    margin-top: 36px;\n    padding-top: 20px;\n    border-top: 1px solid var(--border-lt);\n    display: flex;\n    gap: 24px;\n    flex-wrap: wrap;\n    align-items: center;\n  }\n  .legend-label { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }\n  .legend-item { display: flex; align-items: center; gap: 6px; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: .04em; }\n  .legend-pip { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }\n\n  @media (max-width: 820px) {\n    .kanban-grid { flex-direction: column; overflow-x: visible; }\n    .kanban-row { flex-direction: column; }\n    .col-header { width: 100%; flex-direction: row; align-items: center; padding: 12px 16px; }\n    .col-count { font-size: 22px; }\n    .pipeline { flex-direction: column; }\n    .page { padding: 36px 20px 72px; }\n    .card { width: 100%; }\n    .header-stats { flex-wrap: wrap; }\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n\n  <!-- TOP NAV BAR -->\n  <div class=\"topbar\">\n    <div class=\"brand-row\">\n      <div class=\"brand-icon\"><span><\/span><span><\/span><span><\/span><span><\/span><\/div>\n      <div class=\"brand-name\">CorePVS<\/div>\n    <\/div>\n    <div class=\"header-stats\">\n      <div class=\"stat-block\" data-stage=\"audit\">\n        <div class=\"stat-num\">12<\/div>\n        <div class=\"stat-label\">Audit<\/div>\n      <\/div>\n      <div class=\"stat-block\" data-stage=\"spec\">\n        <div class=\"stat-num\">2<\/div>\n        <div class=\"stat-label\">Spec<\/div>\n      <\/div>\n      <div class=\"stat-block\" data-stage=\"gap\">\n        <div class=\"stat-num\">0<\/div>\n        <div class=\"stat-label\">Gap<\/div>\n      <\/div>\n      <div class=\"stat-block\" data-stage=\"design\">\n        <div class=\"stat-num\">0<\/div>\n        <div class=\"stat-label\">Design<\/div>\n      <\/div>\n      <div class=\"stat-block\" data-stage=\"proto\">\n        <div class=\"stat-num\">0<\/div>\n        <div class=\"stat-label\">Proto<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- PIPELINE -->\n  <div class=\"pipeline-wrap\">\n    <div class=\"section-label\">Design pipeline<\/div>\n    <div class=\"pipeline\">\n\n      <div class=\"phase-block\" style=\"flex:1;\">\n        <div class=\"pipeline-steps\">\n          <div class=\"p-step\">\n            <div class=\"step-num\">01<\/div>\n            <div class=\"step-name\">Audit app X flow<\/div>\n            <div class=\"step-scope\">real reference flow<\/div>\n          <\/div>\n          <div class=\"p-step\">\n            <div class=\"step-num\">02<\/div>\n            <div class=\"step-name\">Structured spec<\/div>\n            <div class=\"step-scope\">SFT-style behavior<\/div>\n          <\/div>\n          <div class=\"p-step\">\n            <div class=\"step-num\">03<\/div>\n            <div class=\"step-name\">Compliance gap<\/div>\n            <div class=\"step-scope\">vs inventory<\/div>\n          <\/div>\n          <div class=\"p-step\">\n            <div class=\"step-num\">04<\/div>\n            <div class=\"step-name\">Final artifacts<\/div>\n            <div class=\"step-scope\">flow + screens<\/div>\n          <\/div>\n          <div class=\"p-step\">\n            <div class=\"step-num\">05<\/div>\n            <div class=\"step-name\">Prototype structure<\/div>\n            <div class=\"step-scope\">build-ready package<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n    <\/div>\n    <div class=\"loop-note\">Do not jump from compliance obligations directly into screens. Start from a real reference flow, formalize behavior, layer compliance, finalize the CorePVS design, then derive prototype-ready artifacts for the next workflow.<\/div>\n  <\/div>\n\n  <!-- KANBAN -->\n  <div class=\"kanban-section\">\n    <div class=\"section-label\">Pipeline states<\/div>\n\n    <div class=\"kanban-grid\">\n\n      <!-- AUDIT -->\n      <div class=\"kanban-row\" data-stage=\"audit\">\n        <div class=\"col-header\">\n          <div class=\"col-label\">Audit<\/div>\n          <div class=\"col-count\">12<\/div>\n        <\/div>\n        <div class=\"cards-row\">\n          <div class=\"card todo\">\n            <div class=\"card-step\">\n              <div class=\"card-code\"><span class=\"step-pip\" style=\"background:var(--border-lt);\"><\/span>WF-2<\/div>\n              <div class=\"card-state\">Pending<\/div>\n            <\/div>\n            <div class=\"card-title\">Insurance &amp; Enrollment (HZV/FAV)<\/div>\n            <div class=\"card-subtitle\">MFA workflow<\/div>\n          <\/div>\n          <div class=\"card todo\">\n            <div class=\"card-step\">\n              <div class=\"card-code\"><span class=\"step-pip\" style=\"background:var(--border-lt);\"><\/span>WF-3<\/div>\n              <div class=\"card-state\">Pending<\/div>\n            <\/div>\n            <div class=\"card-title\">Forms &amp; Certificates<\/div>\n            <div class=\"card-subtitle\">MFA workflow<\/div>\n          <\/div>\n          <div class=\"card todo\">\n            <div class=\"card-step\">\n              <div class=\"card-code\"><span class=\"step-pip\" style=\"background:var(--border-lt);\"><\/span>WF-4<\/div>\n              <div class=\"card-state\">Pending<\/div>\n            <\/div>\n            <div class=\"card-title\">Clinical Documentation<\/div>\n            <div class=\"card-subtitle\">Doctor workflow<\/div>\n          <\/div>\n          <div class=\"card todo\">\n            <div class=\"card-step\">\n              <div class=\"card-code\"><span class=\"step-pip\" style=\"background:var(--border-lt);\"><\/span>WF-5<\/div>\n              <div class=\"card-state\">Pending<\/div>\n            <\/div>\n            <div class=\"card-title\">Service &amp; Billing Documentation<\/div>\n            <div class=\"card-subtitle\">Doctor workflow<\/div>\n          <\/div>\n          <div class=\"card todo\">\n            <div class=\"card-step\">\n              <div class=\"card-code\"><span class=\"step-pip\" style=\"background:var(--border-lt);\"><\/span>WF-7<\/div>\n              <div class=\"card-state\">Pending<\/div>\n            <\/div>\n            <div class=\"card-title\">Prescriptions (Specialty)<\/div>\n            <div class=\"card-subtitle\">Doctor workflow<\/div>\n          <\/div>\n          <div class=\"card todo\">\n            <div class=\"card-step\">\n              <div class=\"card-code\"><span class=\"step-pip\" style=\"background:var(--border-lt);\"><\/span>WF-8<\/div>\n              <div class=\"card-state\">Pending<\/div>\n            <\/div>\n            <div class=\"card-title\">Forms &amp; Certificates<\/div>\n            <div class=\"card-subtitle\">Doctor workflow<\/div>\n          <\/div>\n          <div class=\"card todo\">\n            <div class=\"card-step\">\n              <div class=\"card-code\"><span class=\"step-pip\" style=\"background:var(--border-lt);\"><\/span>WF-9<\/div>\n              <div class=\"card-state\">Pending<\/div>\n            <\/div>\n            <div class=\"card-title\">Chronic Care Programs<\/div>\n            <div class=\"card-subtitle\">Doctor workflow<\/div>\n          <\/div>\n          <div class=\"card todo\">\n            <div class=\"card-step\">\n              <div class=\"card-code\"><span class=\"step-pip\" style=\"background:var(--border-lt);\"><\/span>WF-10<\/div>\n              <div class=\"card-state\">Pending<\/div>\n            <\/div>\n            <div class=\"card-title\">Billing &amp; Submission<\/div>\n            <div class=\"card-subtitle\">Doctor workflow<\/div>\n          <\/div>\n          <div class=\"card todo\">\n            <div class=\"card-step\">\n              <div class=\"card-code\"><span class=\"step-pip\" style=\"background:var(--border-lt);\"><\/span>WF-11<\/div>\n              <div class=\"card-state\">Pending<\/div>\n            <\/div>\n            <div class=\"card-title\">ePA &amp; Document Exchange<\/div>\n            <div class=\"card-subtitle\">Doctor workflow<\/div>\n          <\/div>\n          <div class=\"card todo\">\n            <div class=\"card-step\">\n              <div class=\"card-code\"><span class=\"step-pip\" style=\"background:var(--border-lt);\"><\/span>WF-12<\/div>\n              <div class=\"card-state\">Pending<\/div>\n            <\/div>\n            <div class=\"card-title\">Practice Administration<\/div>\n            <div class=\"card-subtitle\">Admin workflow<\/div>\n          <\/div>\n          <div class=\"card todo\">\n            <div class=\"card-step\">\n              <div class=\"card-code\"><span class=\"step-pip\" style=\"background:var(--border-lt);\"><\/span>WF-13<\/div>\n              <div class=\"card-state\">Pending<\/div>\n            <\/div>\n            <div class=\"card-title\">System Infrastructure<\/div>\n            <div class=\"card-subtitle\">Admin workflow<\/div>\n          <\/div>\n          <div class=\"card todo\">\n            <div class=\"card-step\">\n              <div class=\"card-code\"><span class=\"step-pip\" style=\"background:var(--border-lt);\"><\/span>WF-14<\/div>\n              <div class=\"card-state\">Pending<\/div>\n            <\/div>\n            <div class=\"card-title\">Data Import &amp; Sync<\/div>\n            <div class=\"card-subtitle\">Admin workflow<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- SPEC -->\n      <div class=\"kanban-row\" data-stage=\"spec\">\n        <div class=\"col-header wip-col\">\n          <div class=\"col-label\">Spec<\/div>\n          <div class=\"col-count\">2<\/div>\n        <\/div>\n        <div class=\"cards-row\">\n          <div class=\"card wip\">\n            <div class=\"card-step\">\n              <div class=\"card-code\"><span class=\"step-pip\" style=\"background:var(--wip-acc);\"><\/span>WF-1<\/div>\n              <div class=\"card-state\">Audit done<\/div>\n            <\/div>\n            <div class=\"card-title\">Patient Check-In &amp; Registration<\/div>\n            <div class=\"card-subtitle\">MFA workflow<\/div>\n          <\/div>\n          <div class=\"card wip\">\n            <div class=\"card-step\">\n              <div class=\"card-code\"><span class=\"step-pip\" style=\"background:var(--wip-acc);\"><\/span>WF-6<\/div>\n              <div class=\"card-state\">Audit done<\/div>\n            <\/div>\n            <div class=\"card-title\">Prescriptions (Core)<\/div>\n            <div class=\"card-subtitle\">Doctor workflow<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- GAP -->\n      <div class=\"kanban-row\" data-stage=\"gap\">\n        <div class=\"col-header todo-col\">\n          <div class=\"col-label\">Gap<\/div>\n          <div class=\"col-count\">0<\/div>\n        <\/div>\n        <div class=\"cards-row\"><\/div>\n      <\/div>\n\n      <!-- DESIGN -->\n      <div class=\"kanban-row\" data-stage=\"design\">\n        <div class=\"col-header\">\n          <div class=\"col-label\">Design<\/div>\n          <div class=\"col-count\">0<\/div>\n        <\/div>\n        <div class=\"cards-row\"><\/div>\n      <\/div>\n\n      <!-- PROTO -->\n      <div class=\"kanban-row\" data-stage=\"proto\">\n        <div class=\"col-header wip-col\">\n          <div class=\"col-label\">Proto<\/div>\n          <div class=\"col-count\">0<\/div>\n        <\/div>\n        <div class=\"cards-row\"><\/div>\n      <\/div>\n\n    <\/div>\n  <\/div>\n\n  <!-- LEGEND -->\n  <div class=\"legend\">\n    <span class=\"legend-label\">Steps<\/span>\n    <div class=\"legend-item\"><span class=\"legend-pip\" style=\"background:var(--ink);\"><\/span>01 Audit<\/div>\n    <div class=\"legend-item\"><span class=\"legend-pip\" style=\"background:var(--ink);\"><\/span>02 Structured spec<\/div>\n    <div class=\"legend-item\"><span class=\"legend-pip\" style=\"background:var(--forest);\"><\/span>03 Compliance gap<\/div>\n    <div class=\"legend-item\"><span class=\"legend-pip\" style=\"background:var(--forest);\"><\/span>04 Final artifacts<\/div>\n    <div class=\"legend-item\"><span class=\"legend-pip\" style=\"background:var(--forest);\"><\/span>05 Prototype structure<\/div>\n  <\/div>\n\n<\/div>\n<script>\n  (() => {\n    const stageRows = Array.from(document.querySelectorAll('.kanban-row[data-stage]'));\n    const stageStats = Array.from(document.querySelectorAll('.stat-block[data-stage]'));\n    const kanbanGrid = document.querySelector('.kanban-grid');\n\n    if (!stageRows.length || !stageStats.length || !kanbanGrid) {\n      return;\n    }\n\n    let rafId = null;\n\n    const syncStageCounts = () => {\n      const stageCounts = new Map();\n\n      stageRows.forEach((row) => {\n        const stage = row.dataset.stage;\n        const count = row.querySelectorAll('.cards-row .card').length;\n        const nextCount = String(count);\n        stageCounts.set(stage, count);\n\n        const colCount = row.querySelector('.col-count');\n        if (colCount && colCount.textContent !== nextCount) {\n          colCount.textContent = nextCount;\n        }\n      });\n\n      stageStats.forEach((stat) => {\n        const statNum = stat.querySelector('.stat-num');\n        if (!statNum) {\n          return;\n        }\n\n        const nextCount = String(stageCounts.get(stat.dataset.stage) ?? 0);\n        if (statNum.textContent !== nextCount) {\n          statNum.textContent = nextCount;\n        }\n      });\n    };\n\n    const syncBoard = () => {\n      rafId = null;\n      syncStageCounts();\n    };\n\n    const scheduleSync = () => {\n      if (rafId !== null) {\n        cancelAnimationFrame(rafId);\n      }\n\n      rafId = requestAnimationFrame(syncBoard);\n    };\n\n    const observer = new MutationObserver(scheduleSync);\n    observer.observe(kanbanGrid, {\n      childList: true,\n      subtree: true,\n      characterData: true,\n      attributes: true,\n    });\n\n    window.addEventListener('resize', scheduleSync);\n    window.addEventListener('load', scheduleSync);\n    scheduleSync();\n  })();\n<\/script>\n<\/body>\n<\/html>\n","mtime":1774234728715.2747,"sourcePath":"/Users/nganpham/Documents/core-pvs-proto/docs/discover/design-pipeline.html","folder":null,"navLabel":"Design Pipeline"},{"filename":"FLOW260322-master-user-workflow.md","content":"---\nVersion: 1.0\nLast Updated: 2026-03-22\n---\n\n# PVS-Core User Workflow Diagrams (Markdown)\n\nThis file is a Markdown version of the workflow-diagram artifact set (flowcharts + role-based user journeys).\n\n---\n\n## 1. Overview\n\n### 1.1 Workflow Index\n\n| Workflow | Role | No. of Screen | Audit |\n|---|---|---|---|\n| [1.2 Cross-Tier Dependency Chain](#cross-tier) | Cross-tier | -- | -- |\n| [2.1 (WF-1) Patient Check-In & Registration](#wf-1) | MFA | 6 | [View](docs/artifacts/AUDIT260322-patient-checkin-registration.md) |\n| [2.2 (WF-2) Insurance & Enrollment (HZV/FAV)](#wf-2) | MFA | -- | -- |\n| [2.3 (WF-3) Forms & Certificates](#wf-3) | MFA | -- | -- |\n| [2.4 (WF-4) Clinical Documentation](#wf-4) | Doctor | -- | -- |\n| [2.5 (WF-5) Service & Billing Documentation](#wf-5) | Doctor | -- | -- |\n| [2.6 (WF-6) Prescriptions (Core)](#wf-6) | Doctor | 10 | [View](docs/artifacts/AUDIT260322-prescriptions.md) |\n| [2.7 (WF-7) Prescriptions (Specialty)](#wf-7) | Doctor | -- | -- |\n| [2.8 (WF-8) Forms & Certificates](#wf-8) | Doctor | -- | -- |\n| [2.9 (WF-9) Chronic Care Programs](#wf-9) | Doctor | -- | -- |\n| [2.10 (WF-10) Billing & Submission](#wf-10) | Doctor | -- | -- |\n| [2.11 (WF-11) ePA & Document Exchange](#wf-11) | Doctor | -- | -- |\n| [2.12 (WF-12) Practice Administration](#wf-12) | Admin | -- | -- |\n| [2.13 (WF-13) System Infrastructure](#wf-13) | Admin | -- | -- |\n| [2.14 (WF-14) Data Import & Sync](#wf-14) | Admin | -- | -- |\n\n---\n\n<a id=\"wf-15\"><\/a>\n<a id=\"cross-tier\"><\/a>\n### 1.2 Cross-Tier Dependency Chain\n\nThis section makes workflow design dependencies explicit so we can sequence workflow-based design work to minimize rework.\n\n#### Workflow-level dependency chain (proposed)\n\n```mermaid\nflowchart LR\n    WF12[\"WF-12 Admin: Practice Administration\\n(System Status Bar, users/rights, settings shell)\"] -->|\"permissions + navigation shell\"| WF1[\"WF-1 MFA: Check-In & Registration\"]\n    WF12 -->|\"permissions + navigation shell\"| WF4[\"WF-4 Doctor: Clinical Documentation\\n(Patient Record View)\"]\n    WF12 -->|\"permissions + navigation shell\"| WF5[\"WF-5 Doctor: Service & Billing Documentation\\n(Schein / Billing Record View)\"]\n    WF12 -->|\"permissions + navigation shell\"| WF10[\"WF-10 Doctor: Billing & Submission\\n(Billing Dashboard KV/HZV/ASV)\"]\n\n    WF1 -->|\"identified/created patient context\"| WF4\n    WF1 -->|\"optional patient context\"| WF3[\"WF-3 MFA: Forms & Certificates\"]\n    WF4 -->|\"patient context\"| WF6[\"WF-6 Doctor: Prescriptions (Core)\"]\n    WF6 -->|\"extends prescribing variants\"| WF7[\"WF-7 Doctor: Prescriptions (Specialty)\"]\n    WF4 -->|\"patient context\"| WF8[\"WF-8 Doctor: Forms & Certificates\"]\n    WF4 -->|\"patient context\"| WF9[\"WF-9 Doctor: Chronic Care Programs\"]\n    WF4 -->|\"patient context\"| WF11[\"WF-11 Doctor: ePA & Document Exchange\"]\n\n    WF4 -->|\"creates/anchors billing case context\"| WF5\n    WF5 -->|\"provides Schein + quarter context\"| WF10\n    WF2[\"WF-2 MFA: Insurance & Enrollment (HZV/FAV)\"] -->|\"contract enrollment context\"| WF10\n\n    WF14[\"WF-14 Admin: Data Import & Sync\\n(ICode, catalogs, rule/master data)\"] -.->|\"enables lookups + validation\"| WF6\n    WF14 -.->|\"enables billing catalogs + validations\"| WF10\n    WF14 -.->|\"enables program forms + submissions\"| WF9\n```\n\n#### Dependency Summary (workflow → depends on)\n\n| # | Workflow Links | Depends on | Why it matters |\n|---:|---|---|---|\n| 1 | [WF-12](#wf-12) Practice Administration | — | Defines the global shell (status bar, settings entry points) and RBAC that all workflows sit under. |\n| 2 | [WF-1](#wf-1) Check-In & Registration | WF-12 | Needs shell + permissions; creates/identifies the patient context for downstream clinical work. |\n| 3 | [WF-4](#wf-4) Clinical Documentation | WF-12, (often WF-1) | Patient Record is a hub surface; many later screens launch as panels/dialogs from it. |\n| 4 | [WF-5](#wf-5) Service & Billing Documentation | WF-12, WF-4 | Schein view depends on patient hub context and becomes the anchor for the billing lifecycle. |\n| 5 | [WF-10](#wf-10) Billing & Submission | WF-12, WF-5, (partly WF-2), WF-14 | Billing UI depends on Schein/quarter context and needs validations + catalogs to avoid redesigning the submission surface. |\n| 6 | [WF-6](#wf-6) Prescriptions (Core) | WF-12, WF-4, WF-14 | Prescribing is grounded in patient context and relies on master data for search/safety. |\n| 7 | [WF-7](#wf-7) Prescriptions (Specialty) | WF-6 | Reuses the base prescribing workspace patterns; adds variants without changing the core. |\n| 8 | [WF-3](#wf-3) MFA Forms & Certificates | WF-12, (often WF-1) | Print flows can exist early, but become realistic once patient identity and context are stable. |\n| 9 | [WF-8](#wf-8) Doctor Forms & Certificates | WF-12, WF-4 | Certificates/letters launch from patient context; status/transmission patterns should be consistent across workflows. |\n| 10 | [WF-9](#wf-9) Chronic Care Programs | WF-12, WF-4, WF-14 | Program forms + submissions depend on patient hub patterns and structured master data. |\n| 11 | [WF-11](#wf-11) ePA & Document Exchange | WF-12, WF-4 | Access/entitlement UI must live in the same patient-context patterns and shell rules. |\n| 12 | [WF-2](#wf-2) Insurance & Enrollment | WF-12, WF-4 | Enrollment is often patient-specific and impacts billing mode eligibility and submission constraints. |\n| 13 | [WF-14](#wf-14) Data Import & Sync | WF-12 | Admin-only; enables catalogs and validation UIs used across clinical and billing workflows. |\n| 14 | [WF-13](#wf-13) System Infrastructure | WF-12 | Mostly admin-only; can run in parallel unless TI/module UI gates ePA/KIM behaviors. |\n\n---\n\n## 2. Workflows\n\n<a id=\"wf-1\"><\/a>\n### 2.1 (WF-1) MFA — Patient Check-In & Registration\n\nSource basis: `research-base`\n\n### Flowchart\n\n```mermaid\nflowchart TD\n    START([\"Patient Arrives\"])\n    START ==>|\"Insert eGK\"| CARD[\"Card Read / Check-In Screen\"]\n    CARD -->|\"Match found\"| MATCH[\"Patient Match Review Panel\"]\n    CARD -->|\"No eGK available\"| MANUAL[\"Manual Patient Entry Form\"]\n    CARD -.->|\"EU patient\"| EHIC[\"EHIC Patient Entry Form\"]\n    CARD -->|\"Insurance invalid\"| TEMP[\"Temporary Cost Carrier Form\"]\n    TEMP -->|\"Search carrier\"| COST[\"Cost Carrier Search Panel\"]\n    MATCH -->|\"Confirm patient\"| WAIT[\"Waiting Room Board\"]\n    MANUAL -->|\"Save patient\"| WAIT\n    EHIC -.->|\"Save patient\"| WAIT\n    COST -->|\"Assign carrier\"| WAIT\n    WAIT -->|\"Patient called\"| DONE([\"Enter Consultation\"])\n```\n\n### User Journey\n\n```mermaid\nflowchart LR\n  classDef patient fill:#E8F3FF,stroke:#5A8FA3,stroke-width:1px,color:#0f2633;\n  classDef mfa fill:#EAF7EE,stroke:#4A7C59,stroke-width:1px,color:#0f2633;\n  classDef doctor fill:#FFF3E8,stroke:#A3905A,stroke-width:1px,color:#0f2633;\n  classDef admin fill:#F1ECFF,stroke:#7A5A18,stroke-width:1px,color:#0f2633;\n  classDef system fill:#F4F7FA,stroke:#8DB4C0,stroke-width:1px,color:#0f2633;\n  classDef user fill:#FFFFFF,stroke:#C3D6E2,stroke-width:1px,color:#0f2633;\n\n  subgraph Patient\n    direction TB\n    P1[\"Arrive at practice\"]\n    P2[\"Provide insurance card / eGK\"]\n    P3[\"Wait to be called\"]\n  end\n\n  subgraph MFA\n    direction TB\n    M1[\"Card read & check-in\"]\n    M2[\"Match review / manual entry\"]\n    M3[\"Insurance + cost carrier handling\"]\n    M4[\"Place patient in waiting room\"]\n  end\n\n  subgraph Doctor\n    direction TB\n    D1[\"Call patient and start consultation\"]\n  end\n\n  P1 --> P2\n  P2 --> P3\n  P3 --> M1\n  M1 --> M2\n  M2 --> M3\n  M3 --> M4\n  M4 --> D1\n\n  class P1,P2,P3 patient\n  class M1,M2,M3,M4 mfa\n  class D1 doctor\n```\n\n<a id=\"wf-1-gpro\"><\/a>\n### 2.1b (WF-1 Alt) MFA — Patient Check-In & Registration — gpro-base\n\nSource basis: `gpro-base`\n\n### Flowchart\n\n```mermaid\nflowchart TD\n    START([\"Patient Arrives\"])\n    START --> OVERVIEW[\"Patient Overview\"]\n    OVERVIEW -->|\"Read eGK / card event received\"| CARD[\"eGK Patient Payload Loaded\"]\n\n    CARD -->|\"No matched patient\"| NEWDIALOG[\"Create / View Patient Dialog<br/>Create new patient mode\"]\n    CARD -->|\"1 exact match\"| VIEWDIALOG[\"Create / View Patient Dialog<br/>View patient mode\"]\n    CARD -->|\"Multiple or non-exact matches\"| SELECT[\"Select Patient Dialog\"]\n\n    NEWDIALOG -->|\"Confirm\"| CREATE[\"Create Patient Form\"]\n    NEWDIALOG -->|\"Cancel\"| OVERVIEW\n\n    VIEWDIALOG -->|\"Confirm\"| RECORD[\"Patient Record\"]\n    VIEWDIALOG -->|\"Cancel\"| OVERVIEW\n\n    SELECT -->|\"Cancel\"| OVERVIEW\n    SELECT -->|\"Select exact match\"| VIEW2[\"Create / View Patient Dialog<br/>View patient mode\"]\n    SELECT -->|\"Select partial / conflict match\"| SYNC[\"Synchronise Patient Dialog\"]\n\n    VIEW2 -->|\"Confirm\"| RECORD\n    VIEW2 -->|\"Cancel\"| OVERVIEW\n\n    SYNC -->|\"Create patient from card\"| ROUTE{\"Valid current-quarter Schein<br/>for card insurance?\"}\n    SYNC -->|\"Update existing patient\"| ROUTE\n    SYNC -->|\"Cancel\"| OVERVIEW\n\n    CREATE -->|\"Save new patient\"| ROUTE\n    CREATE -->|\"Cancel\"| OVERVIEW\n\n    ROUTE -->|\"Yes\"| RECORD\n    ROUTE -->|\"No\"| SCHEIN[\"Patient Record<br/>#schein or #private\"]\n\n    RECORD --> DONE([\"Registration ready for consultation / further admin steps\"])\n    SCHEIN --> DONE\n    RECORD -.->|\"Adjacent downstream handoff\"| WAIT[\"Waiting Room\"]\n    SCHEIN -.->|\"After Schein handling\"| WAIT\n```\n\n### User Journey\n\n```mermaid\nflowchart LR\n  classDef patient fill:#E8F3FF,stroke:#5A8FA3,stroke-width:1px,color:#0f2633;\n  classDef mfa fill:#EAF7EE,stroke:#4A7C59,stroke-width:1px,color:#0f2633;\n  classDef doctor fill:#FFF3E8,stroke:#A3905A,stroke-width:1px,color:#0f2633;\n  classDef admin fill:#F1ECFF,stroke:#7A5A18,stroke-width:1px,color:#0f2633;\n  classDef system fill:#F4F7FA,stroke:#8DB4C0,stroke-width:1px,color:#0f2633;\n  classDef user fill:#FFFFFF,stroke:#C3D6E2,stroke-width:1px,color:#0f2633;\n\n  subgraph Patient\n    direction TB\n    P1[\"Arrive at practice\"]\n    P2[\"Present eGK / insurance card\"]\n    P3[\"Wait for registration result\"]\n  end\n\n  subgraph MFA\n    direction TB\n    M1[\"Open patient overview and receive card read\"]\n    M2[\"Resolve match state: create, view, or select\"]\n    M3[\"Review candidate patient or synchronise profile when needed\"]\n    M4[\"Create patient or update existing details\"]\n    M5[\"Route to patient record or Schein-required entry\"]\n    M6[\"Optionally hand off to waiting room\"]\n  end\n\n  subgraph Doctor\n    direction TB\n    D1[\"Continue from patient record into consultation\"]\n  end\n\n  P1 --> P2\n  P2 --> M1\n  M1 --> M2\n  M2 --> M3\n  M3 --> M4\n  M4 --> M5\n  M5 --> D1\n  M5 --> M6\n  M6 --> D1\n  D1 --> P3\n\n  class P1,P2,P3 patient\n  class M1,M2,M3,M4,M5,M6 mfa\n  class D1 doctor\n```\n\n### Key differences — research-base vs gpro-base\n\n| Area | research-base | gpro-base | Design implication |\n|---|---|---|---|\n| Entry point | Starts at a dedicated `Card Read / Check-In Screen` | Starts at `Patient Overview` and reacts to card-read event | Future design should decide whether check-in is a standalone screen or an event-driven workflow inside the patient overview shell |\n| Matching model | Assumes a simple `Patient Match Review Panel` | Explicitly branches into exact match, no match, and ambiguous/non-exact match | Matching states likely need first-class UX states, not just a single review step |\n| Registration resolution | Manual entry / EHIC / temporary cost carrier are primary visible branches | `Create patient`, `Select patient`, and `Synchronise patient` are primary visible branches | Flow architecture should separate identity resolution from insurance exception handling |\n| Existing patient handling | `Match found -> confirm patient` is comparatively direct | Existing-patient path may require selection and field-level synchronisation before entry | Existing-patient reconciliation needs explicit compare-and-resolve UI, not just confirmation UI |\n| Insurance/Schein handling | Highlights invalid insurance and temporary cost carrier resolution up front | Highlights post-save routing based on valid current-quarter Schein and card insurance | Insurance validity and Schein readiness may need to be modeled as different checkpoints in the workflow |\n| Patient record routing | Implied handoff toward consultation via waiting room | Explicit route to `Patient Record`, sometimes deep-linked to `#schein` or `#private` | Design should treat patient-record entry as a major state transition with route-level variants |\n| Waiting room role | Modeled as a core step in the main flow | Modeled as an optional downstream handoff after patient record / Schein handling | Waiting room should be designed as a downstream operational handoff unless stronger evidence makes it mandatory in core registration |\n| Flow shape | More linear front-desk intake model | Match-and-route model with conditional reconciliation and post-registration branching | Spec work should prefer a branched state model over a single linear happy path |\n\n---\n\n<a id=\"wf-2\"><\/a>\n### 2.2 (WF-2) MFA — Insurance & Enrollment (HZV/FAV)\n\n### Flowchart\n\n```mermaid\nflowchart TD\n    START([\"Open Enrollment\"])\n    START ==>|\"New enrollment\"| TE[\"TE Form (Enrollment Declaration)\"]\n    TE -->|\"Submit\"| LIST[\"TE Overview List\"]\n    LIST -->|\"Review entries\"| MGMT[\"Participation Management View\"]\n    LIST -.->|\"Configure\"| SETTINGS[\"Enrollment Settings\"]\n    MGMT -->|\"Import PTV data\"| IMPORT[\"PTV Import Wizard\"]\n    TE -.->|\"Check eligibility\"| AOK[\"AOK Check 18+ Panel\"]\n    IMPORT -->|\"Complete\"| DONE([\"Enrollment Updated\"])\n```\n\n### User Journey\n\n```mermaid\nflowchart LR\n  classDef patient fill:#E8F3FF,stroke:#5A8FA3,stroke-width:1px,color:#0f2633;\n  classDef mfa fill:#EAF7EE,stroke:#4A7C59,stroke-width:1px,color:#0f2633;\n  classDef doctor fill:#FFF3E8,stroke:#A3905A,stroke-width:1px,color:#0f2633;\n  classDef admin fill:#F1ECFF,stroke:#7A5A18,stroke-width:1px,color:#0f2633;\n  classDef system fill:#F4F7FA,stroke:#8DB4C0,stroke-width:1px,color:#0f2633;\n  classDef user fill:#FFFFFF,stroke:#C3D6E2,stroke-width:1px,color:#0f2633;\n\n  subgraph Patient\n    direction TB\n    P1[\"Provide enrollment details\"]\n  end\n\n  subgraph MFA\n    direction TB\n    M1[\"Open enrollment and start new TE\"]\n    M2[\"Check eligibility (AOK 18+)\"]\n    M3[\"Submit TE and review overview list\"]\n    M4[\"Manage participation entries\"]\n    M5[\"Import PTV data (if needed)\"]\n  end\n\n  P1 --> M1\n  M1 --> M2\n  M2 --> M3\n  M3 --> M4\n  M4 --> M5\n\n  class P1 patient\n  class M1,M2,M3,M4,M5 mfa\n```\n\n---\n\n<a id=\"wf-3\"><\/a>\n### 2.3 (WF-3) MFA — Forms & Certificates\n\n### Flowchart\n\n```mermaid\nflowchart TD\n    START([\"Generate Form\"])\n    PTV[\"PTV Form Print Preview\"] -->|\"Print\"| PRINT[\"Form Print Preview\"]\n    REF[\"Referral Form Print Preview\"] -->|\"Print\"| PRINT\n    START -->|\"Select PTV\"| PTV\n    START -->|\"Select Referral\"| REF\n    PRINT -.->|\"Adjust settings\"| SETTINGS[\"Form Printer Settings\"]\n    PRINT -->|\"Confirm print\"| DONE([\"Form Printed\"])\n```\n\n### User Journey\n\n```mermaid\nflowchart LR\n  classDef patient fill:#E8F3FF,stroke:#5A8FA3,stroke-width:1px,color:#0f2633;\n  classDef mfa fill:#EAF7EE,stroke:#4A7C59,stroke-width:1px,color:#0f2633;\n  classDef doctor fill:#FFF3E8,stroke:#A3905A,stroke-width:1px,color:#0f2633;\n  classDef admin fill:#F1ECFF,stroke:#7A5A18,stroke-width:1px,color:#0f2633;\n  classDef system fill:#F4F7FA,stroke:#8DB4C0,stroke-width:1px,color:#0f2633;\n  classDef user fill:#FFFFFF,stroke:#C3D6E2,stroke-width:1px,color:#0f2633;\n\n  subgraph MFA\n    direction TB\n    M1[\"Choose form type (PTV / Referral)\"]\n    M2[\"Review print preview\"]\n    M3[\"Adjust printer settings (optional)\"]\n    M4[\"Confirm and print\"]\n  end\n\n  subgraph Patient\n    direction TB\n    P1[\"Receive printed document\"]\n  end\n\n  M1 --> M2\n  M2 --> M3\n  M3 --> M4\n  M4 --> P1\n\n  class P1 patient\n  class M1,M2,M3,M4 mfa\n```\n\n---\n\n<a id=\"wf-4\"><\/a>\n### 2.4 (WF-4) Doctor — Clinical Documentation\n\n### Flowchart\n\n```mermaid\nflowchart TD\n    START([\"Open Patient\"])\n    START ==>|\"Select patient\"| RECORD[\"Patient Record View\"]\n\n    subgraph Documentation[\"Documentation\"]\n        NOTE[\"Clinical Note Editor\"]\n        LETTER[\"Doctor Letter Composer\"]\n        GDT[\"GDT Device Data Review\"]\n    end\n\n    subgraph References[\"Reference Tools\"]\n        CODING[\"Coding Instructions Browser\"]\n        RULES[\"Rule Violation Overview\"]\n        PNSD[\"pnSD Configuration Dialog\"]\n    end\n\n    RECORD ==>|\"Write note\"| NOTE\n    RECORD -->|\"Compose letter\"| LETTER\n    RECORD -.->|\"Review device data\"| GDT\n    RECORD -->|\"Open inbox\"| KIM[\"KIM Inbox\"]\n    RECORD -->|\"Track quantities\"| QTY[\"Quantity Tracking Panel\"]\n    RECORD -.->|\"Lookup codes\"| CODING\n    RECORD -.->|\"Check rules\"| RULES\n    RECORD -.->|\"Configure pnSD\"| PNSD\n    NOTE -->|\"Save\"| DONE([\"Documentation Saved\"])\n```\n\n### User Journey\n\n```mermaid\nflowchart LR\n  classDef patient fill:#E8F3FF,stroke:#5A8FA3,stroke-width:1px,color:#0f2633;\n  classDef mfa fill:#EAF7EE,stroke:#4A7C59,stroke-width:1px,color:#0f2633;\n  classDef doctor fill:#FFF3E8,stroke:#A3905A,stroke-width:1px,color:#0f2633;\n  classDef admin fill:#F1ECFF,stroke:#7A5A18,stroke-width:1px,color:#0f2633;\n  classDef system fill:#F4F7FA,stroke:#8DB4C0,stroke-width:1px,color:#0f2633;\n  classDef user fill:#FFFFFF,stroke:#C3D6E2,stroke-width:1px,color:#0f2633;\n\n  subgraph Patient\n    direction TB\n    P1[\"Provide clinical info during visit\"]\n  end\n\n  subgraph Doctor\n    direction TB\n    D1[\"Open patient record\"]\n    D2[\"Write clinical note\"]\n    D3[\"Compose letter / review device data (optional)\"]\n    D4[\"Check coding rules (optional)\"]\n    D5[\"Save documentation\"]\n  end\n\n  P1 --> D1\n  D1 --> D2\n  D2 --> D3\n  D3 --> D4\n  D4 --> D5\n\n  class P1 patient\n  class D1,D2,D3,D4,D5 doctor\n```\n\n---\n\n<a id=\"wf-5\"><\/a>\n### 2.5 (WF-5) Doctor — Service & Billing Documentation\n\n### Flowchart\n\n```mermaid\nflowchart TD\n    START([\"Open Schein\"])\n    START ==>|\"Select Schein\"| SCHEIN[\"Schein / Billing Record View\"]\n    SCHEIN -->|\"Quarter end\"| QUARTER[\"Quarter Transition Dashboard\"]\n    SCHEIN -->|\"Terminate service\"| TERM[\"Termination Notice Manager\"]\n    SCHEIN -->|\"Nursing flat-rate\"| NURSING[\"Nursing Home Flat-Rate Documentation Panel\"]\n    SCHEIN -.->|\"Lab check\"| LAB[\"Lab Proficiency Gate\"]\n    SCHEIN -.->|\"Resolve conflict\"| CONFLICT[\"KV / HZV Conflict Review Panel\"]\n    QUARTER -->|\"Submit\"| DONE([\"Quarter Closed\"])\n```\n\n### User Journey\n\n```mermaid\nflowchart LR\n  classDef patient fill:#E8F3FF,stroke:#5A8FA3,stroke-width:1px,color:#0f2633;\n  classDef mfa fill:#EAF7EE,stroke:#4A7C59,stroke-width:1px,color:#0f2633;\n  classDef doctor fill:#FFF3E8,stroke:#A3905A,stroke-width:1px,color:#0f2633;\n  classDef admin fill:#F1ECFF,stroke:#7A5A18,stroke-width:1px,color:#0f2633;\n  classDef system fill:#F4F7FA,stroke:#8DB4C0,stroke-width:1px,color:#0f2633;\n  classDef user fill:#FFFFFF,stroke:#C3D6E2,stroke-width:1px,color:#0f2633;\n\n  subgraph Doctor\n    direction TB\n    D1[\"Open and select Schein\"]\n    D2[\"Document services and context\"]\n    D3[\"Resolve conflicts / lab gates (optional)\"]\n    D4[\"Perform quarter transition\"]\n    D5[\"Submit quarter close\"]\n  end\n\n  D1 --> D2\n  D2 --> D3\n  D3 --> D4\n  D4 --> D5\n\n  class D1,D2,D3,D4,D5 doctor\n```\n\n---\n\n<a id=\"wf-6\"><\/a>\n### 2.6 (WF-6) Doctor — Prescriptions (Core)\n\n### Flowchart\n\n```mermaid\nflowchart TD\n    START([\"Prescribe Medication\"])\n    START ==>|\"New Rx\"| BUILDER[\"Prescription Builder\"]\n    BUILDER -->|\"Search drug\"| SEARCH[\"Drug Search Panel\"]\n    SEARCH -->|\"Drug selected\"| BUILDER\n    SEARCH -.->|\"Interaction found\"| ALERT[\"Interaction Alert Dialog\"]\n    SEARCH -.->|\"Calculate dose\"| DOSAGE[\"Dosage Calculator Panel\"]\n    SEARCH -.->|\"Safety warning\"| RED[\"Red Hand Letter Alert\"]\n    BUILDER ==>|\"Confirm Rx\"| QUEUE[\"Prescription Queue\"]\n    QUEUE -->|\"View status\"| STATUS[\"Prescription Status View\"]\n    QUEUE -->|\"Print copy\"| COPY[\"Patient Copy Preview\"]\n    STATUS -->|\"Complete\"| DONE([\"Prescription Issued\"])\n```\n\n### User Journey\n\n```mermaid\nflowchart LR\n  classDef patient fill:#E8F3FF,stroke:#5A8FA3,stroke-width:1px,color:#0f2633;\n  classDef mfa fill:#EAF7EE,stroke:#4A7C59,stroke-width:1px,color:#0f2633;\n  classDef doctor fill:#FFF3E8,stroke:#A3905A,stroke-width:1px,color:#0f2633;\n  classDef admin fill:#F1ECFF,stroke:#7A5A18,stroke-width:1px,color:#0f2633;\n  classDef system fill:#F4F7FA,stroke:#8DB4C0,stroke-width:1px,color:#0f2633;\n  classDef user fill:#FFFFFF,stroke:#C3D6E2,stroke-width:1px,color:#0f2633;\n\n  subgraph Doctor\n    direction TB\n    D1[\"Start new prescription\"]\n    D2[\"Search and select drug\"]\n    D3[\"Review safety alerts / dosage (if shown)\"]\n    D4[\"Confirm prescription\"]\n  end\n\n  subgraph System\n    direction TB\n    S1[\"Run interaction + safety checks\"]\n    S2[\"Queue and track status\"]\n  end\n\n  subgraph Patient\n    direction TB\n    P1[\"Receive patient copy (optional print)\"]\n  end\n\n  D1 --> D2\n  D2 --> D3\n  D3 --> D4\n  D4 --> S1\n  S1 --> S2\n  S2 --> P1\n\n  class P1 patient\n  class D1,D2,D3,D4 doctor\n  class S1,S2 system\n```\n\n<a id=\"wf-6-gpro\"><\/a>\n### 2.6b (WF-6 Alt) Doctor — Prescriptions (Core) — gpro-base\n\nSource basis: `gpro-base`\n\n### Flowchart\n\n```mermaid\nflowchart LR\n    A[\"Patient Record\"] --> B[\"Medication Tab\"]\n    B --> C[\"Prescribed Medication\"]\n    C --> D[\"Search Medication\"]\n    D --> E[\"Select Group\"]\n    E --> F[\"Select Medication\"]\n    F --> G[\"Shopping Bag / Recipe Pool\"]\n    G --> H[\"Edit Quantity, Intake Interval,<br/>Further Info, As Needed\"]\n    H --> I{\"Prescription path\"}\n\n    I -->|\"Standard form\"| J[\"Prescribe\"]\n    J --> K[\"Print Settings / Print Preview\"]\n    K --> L[\"Save Prescription Form\"]\n    L --> M[\"Timeline Medication Form Detail\"]\n\n    I -->|\"E-Rezept\"| N[\"Create ERP Bundles\"]\n    N --> O{\"Bundle creation successful?\"}\n    O -->|\"No\"| P[\"Bundle Creation Failed\"]\n    O -->|\"Yes\"| Q[\"ERP Ready\"]\n    Q --> R[\"Sign and Send ERP\"]\n    R --> S{\"Transmission result\"}\n    S -->|\"Success\"| T[\"E-Rezept Sent\"]\n    S -->|\"Failure\"| U[\"Send Failed / Retry / Abort\"]\n    T --> V[\"E-Rezept Status / PDF / Resend / Remove\"]\n```\n\n### User Journey\n\n```mermaid\nflowchart LR\n  classDef patient fill:#E8F3FF,stroke:#5A8FA3,stroke-width:1px,color:#0f2633;\n  classDef mfa fill:#EAF7EE,stroke:#4A7C59,stroke-width:1px,color:#0f2633;\n  classDef doctor fill:#FFF3E8,stroke:#A3905A,stroke-width:1px,color:#0f2633;\n  classDef admin fill:#F1ECFF,stroke:#7A5A18,stroke-width:1px,color:#0f2633;\n  classDef system fill:#F4F7FA,stroke:#8DB4C0,stroke-width:1px,color:#0f2633;\n  classDef user fill:#FFFFFF,stroke:#C3D6E2,stroke-width:1px,color:#0f2633;\n\n  subgraph Doctor\n    direction TB\n    D1[\"Open patient record and medication tab\"]\n    D2[\"Search and select medication\"]\n    D3[\"Build prescription in shopping bag\"]\n    D4[\"Choose standard form or E-Rezept path\"]\n    D5[\"Review print, save, sign, send, or recover status\"]\n  end\n\n  subgraph System\n    direction TB\n    S1[\"Load medication context and search results\"]\n    S2[\"Validate quantity, intake interval, and free-text completeness\"]\n    S3[\"Generate forms, ERP bundles, and transmission status\"]\n  end\n\n  subgraph Patient\n    direction TB\n    P1[\"Receive prescription output or downstream fulfillment result\"]\n  end\n\n  D1 --> D2\n  D2 --> S1\n  S1 --> D3\n  D3 --> S2\n  S2 --> D4\n  D4 --> D5\n  D5 --> S3\n  S3 --> P1\n\n  class P1 patient\n  class D1,D2,D3,D4,D5 doctor\n  class S1,S2,S3 system\n```\n\n### Key differences — research-base vs gpro-base\n\n| Area | research-base | gpro-base | Design implication |\n|---|---|---|---|\n| Entry point | Starts from a generic `Prescribe Medication` action | Starts from `Patient Record -> Medication Tab -> Prescribed Medication` | Future spec work should model prescribing as a patient-context workflow, not an isolated action entry |\n| Core workspace | Uses a direct `Prescription Builder` with supporting search panel | Uses `Prescribed Medication` plus `Shopping Bag / Recipe Pool` as the working workspace | The prescription model likely needs a multi-stage workspace with a persistent draft collection, not a single builder surface |\n| Path split | Implies one core path that later queues and tracks status | Explicitly splits into `Standard form` and `E-Rezept` paths after editing prescription details | Workflow state should branch deliberately between form-based and ERP-based fulfillment rather than treating them as one generic output state |\n| Standard prescription handling | Goes from builder to queue/status with optional print copy | Goes through `Print Settings / Print Preview`, save, then `Timeline Medication Form Detail` | Standard prescriptions need form-generation and saved-detail states, not only queue/status abstractions |\n| E-Rezept lifecycle | Abstracted as queue plus status view | Explicitly models bundle creation, success/failure, sign/send, resend, abort, PDF, and follow-up status actions | The ERP lifecycle should be represented as a dedicated state machine with recovery paths |\n| Validation model | Focuses on interaction, dosage, and safety alerts during search | Adds draft validation constraints such as intake interval, quantity, free-text completeness, and empty shopping bag blocking | Spec work should distinguish clinical safety checks from form-readiness and transmission-readiness checks |\n| Recovery behavior | Minimal post-confirmation recovery is visible in the base flow | Includes bundle failure, send failure, retry, abort, resend, and reopen prescription context | The design needs explicit recovery and retry states rather than a single terminal status view |\n| Flow shape | Relatively linear search -> builder -> queue -> status model | Layered medication workflow with adjacent medication-plan surface, draft editing, branch split, and post-send retrieval | The target workflow should favor a branched, stateful prescribing model over a linear happy-path diagram |\n\n---\n\n<a id=\"wf-7\"><\/a>\n### 2.7 (WF-7) Doctor — Prescriptions (Specialty)\n\n### Flowchart\n\n```mermaid\nflowchart TD\n    subgraph DiGA[\"DiGA\"]\n        DIGA_BUILD[\"DiGA Prescription Builder\"]\n        DIGA_DIR[\"DiGA Directory Browser\"]\n        DIGA_BUILD -->|\"Browse apps\"| DIGA_DIR\n        DIGA_DIR -->|\"Select app\"| DIGA_BUILD\n    end\n\n    subgraph Heilmittel[\"Heilmittel / Hilfsmittel\"]\n        HEIL[\"Heilmittel Prescription Form\"]\n        HILF[\"Hilfsmittel Prescription Form\"]\n        HILF_SEARCH[\"Hilfsmittelverzeichnis Search\"]\n        HILF -->|\"Search catalog\"| H
