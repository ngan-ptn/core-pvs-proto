ass=\"legend-item\"><span class=\"legend-pip\" style=\"background:var(--forest);\"><\/span>04 Final artifacts<\/div>\n    <div class=\"legend-item\"><span class=\"legend-pip\" style=\"background:var(--forest);\"><\/span>05 Prototype structure<\/div>\n  <\/div>\n\n<\/div>\n<\/body>\n<\/html>\n","mtime":1774157114064.6514,"sourcePath":"/Users/vanle/Documents/core-pvs-proto/docs/discover/design-pipeline.html","folder":null,"navLabel":"Design Pipeline"},{"filename":"AUDIT260322-prescription-pvs-base.md","content":"# System Audit — Prescription Flow in `pvs-base-1`\n\n## Artifact Info\n- Artifact code: `AUDIT`\n- Date: `260322`\n- Workflow: `Prescription`\n- Reference system: `pvs-base-1`\n- Audit basis: local clone at `/Users/vanle/pvs-base-1`\n\n## Reference Set\n- `/Users/vanle/pvs-base-1/testings/kit/page-object/mvz/mvz-medication.po.ts`\n- `/Users/vanle/pvs-base-1/pkgs/app_mvz/module_medication_kbv/medication/MedicationKBV.tsx`\n- `/Users/vanle/pvs-base-1/pkgs/app_mvz/module_medication_kbv/shopping-bag/MedicationShoppingBag.tsx`\n- `/Users/vanle/pvs-base-1/docs/api/form-service-payloads.md`\n- `/Users/vanle/pvs-base-1/ares/app/mvz/test/app/medicine/medicine_test.go`\n- `/Users/vanle/pvs-base-1/pkgs/pvs-hermes/bff/app_mvz_erezept.ts`\n- `/Users/vanle/pvs-base-1/ares/app/mvz/api/erezept/erezept.d.go`\n\n## 1. Flow Summary\n\n```mermaid\nflowchart LR\n    A[Patient Record] --> B[Medication Tab]\n    B --> C[Prescribed Medication]\n    C --> D[Search Medication]\n    D --> E[Select Group]\n    E --> F[Select Medication]\n    F --> G[Shopping Bag / Recipe Pool]\n    G --> H[Edit Quantity, Intake Interval, Further Info, As Needed]\n    H --> I{Prescription path}\n\n    I -->|Standard form| J[Prescribe]\n    J --> K[Print Settings / Print Preview]\n    K --> L[Save Prescription Form]\n    L --> M[Timeline Medication Form Detail]\n\n    I -->|E-Rezept| N[Create ERP Bundles]\n    N --> O{Bundle creation successful?}\n    O -->|No| P[Bundle Creation Failed]\n    O -->|Yes| Q[ERP Ready]\n    Q --> R[Sign and Send ERP]\n    R --> S{Transmission result}\n    S -->|Success| T[E-Rezept Sent]\n    S -->|Failure| U[Send Failed / Retry / Abort]\n    T --> V[E-Rezept Status / PDF / Resend / Remove]\n```\n\n## 2. Screen Map With Related Actions And States\n\n### Journey Diagram\n\n```mermaid\nstateDiagram-v2\n    [*] --> Patient_Record\n\n    state \"Patient Record\" as Patient_Record\n    state \"Medication Tab\" as Medication_Tab\n    state \"Prescribed Medication\" as Prescribed_Medication\n    state \"Medication Plan\" as Medication_Plan\n    state \"Shopping Bag / Recipe Pool\" as Shopping_Bag\n    state \"Print Preview / Print Settings\" as Print_Preview\n    state \"ERP Bundle Creation\" as ERP_Bundle\n    state \"E-Rezept Send / Transmission\" as ERP_Send\n    state \"Timeline Medication Form Detail\" as Timeline_Detail\n    state \"E-Rezept List / Retrieval Surface\" as ERP_List\n\n    Patient_Record --> Medication_Tab: open Medication tab\n    Medication_Tab --> Prescribed_Medication: select Prescribed Medication\n    Medication_Tab --> Medication_Plan: select Medication Plan\n    Medication_Plan --> Prescribed_Medication: return to prescribing\n\n    Prescribed_Medication --> Prescribed_Medication: search / group select / medicine select\n    Prescribed_Medication --> Shopping_Bag: add to shopping bag\n\n    Shopping_Bag --> Shopping_Bag: edit quantity / intake / notes / as needed\n    Shopping_Bag --> Print_Preview: Prescribe (standard form path)\n    Shopping_Bag --> ERP_Bundle: create ERP bundles (e-prescription path)\n\n    Print_Preview --> Timeline_Detail: save prescription form\n\n    ERP_Bundle --> ERP_Bundle: bundle creation in progress\n    ERP_Bundle --> ERP_Send: bundle created\n    ERP_Bundle --> Shopping_Bag: bundle creation failed\n\n    ERP_Send --> ERP_Send: sign / send / retry / abort\n    ERP_Send --> ERP_List: send success\n    ERP_Send --> ERP_Bundle: resend preparation\n    ERP_Send --> Shopping_Bag: recoverable correction path\n\n    Timeline_Detail --> Prescribed_Medication: reopen and continue editing\n    ERP_List --> ERP_Send: resend / abort / follow-up transmission action\n    ERP_List --> Prescribed_Medication: reopen related prescription context\n```\n\n### Swimlane Journey\n\n```mermaid\nflowchart LR\n    subgraph ENCOUNTER[\"ENCOUNTER\"]\n        direction TB\n\n        subgraph L1[\"Standard Prescription Path\"]\n            A1[\"S001 Patient Record\"]\n            A2[\"S002 Medication Tab\"]\n            A3[\"S003 Prescribed Medication\"]\n            A4[\"S004 Shopping Bag / Recipe Pool\"]\n            A5[\"S005 Print Preview / Print Settings\"]\n            A6[\"S006 Timeline Medication Form Detail\"]\n            A1 --> A2 --> A3 --> A4 --> A5 --> A6\n        end\n\n        subgraph L2[\"E-Prescription Path\"]\n            B1[\"S003 Prescribed Medication\"]\n            B2[\"S004 Shopping Bag / Recipe Pool\"]\n            B3[\"S007 ERP Bundle Creation\"]\n            B4[\"S008 E-Rezept Send / Transmission\"]\n            B5[\"S009 E-Rezept List / Retrieval Surface\"]\n            B1 --> B2 --> B3 --> B4 --> B5\n        end\n    end\n\n    subgraph WRAPUP[\"WRAP-UP / STATUS\"]\n        direction TB\n\n        subgraph L3[\"Status And Recovery Path\"]\n            C1[\"S009 E-Rezept List / Retrieval Surface\"]\n            C2[\"S008 Retry / Abort / Resend\"]\n            C3[\"S006 Timeline Medication Form Detail\"]\n            C4[\"S003 Reopen Prescription Context\"]\n            C1 --> C2\n            C1 --> C3\n            C2 --> C1\n            C3 --> C4\n        end\n    end\n```\n\n### `Patient Record`\nEntry point where the user reaches the medication workflow.\n\n**User actions**\n- Open patient chart.\n- Open `Medication` tab.\n\n**System actions**\n- Load patient context.\n- Resolve medication-related patient data.\n\n**States**\n- `patient_record_loaded`\n\n### `Medication Tab`\nContainer surface for medication-related work.\n\n**User actions**\n- Switch to `Prescribed Medication`.\n- Switch to `Medication Plan`.\n\n**System actions**\n- Load medication tab data and shared medication context.\n- Fetch predefined medication data and supporting metadata.\n\n**States**\n- `medication_tab_loaded`\n- `prescribed_medication_active`\n- `medication_plan_active`\n\n### `Prescribed Medication`\nPrimary prescribing workspace for search, selection, and current prescription work.\n\n**User actions**\n- Click into the medication search field.\n- Enter search criteria.\n- Select a medication group.\n- Select a trade-name medication or free-text medication.\n- Open secondary detail flows when needed.\n\n**System actions**\n- Search medication database and render grouped results.\n- Load secondary data such as price comparison, alternatives, warnings, hand letters, and MMI status.\n\n**States**\n- `search_idle`\n- `searching`\n- `search_results_loaded`\n- `group_selected`\n- `medicine_selected`\n- `second_layer_open`\n\n### `Medication Plan`\nAdjacent medication-management surface.\n\n**User actions**\n- Review existing medication plan.\n- Switch back to prescribing workspace.\n\n**System actions**\n- Load plan-related medication context.\n\n**States**\n- `medication_plan_active`\n\n### `Shopping Bag / Recipe Pool`\nTemporary working collection of selected medicines and editable prescription details.\n\n**User actions**\n- Add medication to shopping bag.\n- Increase or decrease quantity.\n- Enter intake interval.\n- Enter further information.\n- Toggle `As needed`.\n- Remove individual items.\n- Remove all items.\n- Open `Prescribe`.\n\n**System actions**\n- Add chosen medication into a persisted shopping bag structure.\n- Validate whether a prescription is allowed based on intake interval, quantity, and free-text completeness.\n\n**States**\n- `shopping_bag_empty`\n- `shopping_bag_with_items`\n- `editing_medicine`\n- `missing_intake_interval`\n- `missing_freetext_name`\n- `invalid_quantity`\n- `not_prescribe_able`\n- `prescribe_able`\n- `remove_all_confirm_open`\n\n### `Print Preview / Print Settings`\nForm-oriented prescription review and print/save configuration for the standard prescription path.\n\n**User actions**\n- Review `Print settings`.\n- Save the prescription or form.\n\n**System actions**\n- Generate form payloads for selected prescription type such as `Muster_16`, `Blaues_Rezept`, `Gruenes_Rezept`, `Btm_Rezept`, and `eRezept`.\n- Save or print prescription forms through `/api/app/mvz/form/app/prescribeV2`.\n\n**States**\n- `print_settings_open`\n- `saving_prescription`\n- `prescription_saved`\n\n### `ERP Bundle Creation`\nTransitional flow state for the e-prescription path.\n\n**User actions**\n- Trigger ERP bundle creation from prepared form info.\n\n**System actions**\n- Create bundles from `FormInfos`.\n\n**States**\n- `bundle_creation_in_progress`\n- `bundle_created`\n- `bundle_creation_failed`\n- `erezept_ready_to_sign_send`\n\n### `E-Rezept Send / Transmission`\nDedicated ERP branch for sign, send, retry, and abort behaviors.\n\n**User actions**\n- Sign and send ERP.\n- Retry failed transmission.\n- Abort where supported.\n\n**System actions**\n- Persist e-prescription metadata.\n- Call `PrescribeERP`, `SignAndSendERP`, `ResendERP`, and `GetPdfUrl`.\n- Through companion/TI integration, create, activate, or abort e-prescription tasks against external services.\n\n**States**\n- `erezept_created`\n- `erezept_sent`\n- `erezept_aborted`\n- `erezept_resend_pending`\n- `send_failed`\n\n### `Timeline Medication Form Detail`\nRead-back detail view for saved medication prescription entries.\n\n**User actions**\n- Re-open saved prescription details from timeline or history.\n\n**System actions**\n- Load saved medication form detail.\n\n**States**\n- `timeline_detail_view`\n\n### `E-Rezept List / Retrieval Surface`\nStatus and retrieval surface exposed by E-Rezept APIs for existing items.\n\n**User actions**\n- Review sent status.\n- Open PDF.\n- Resend.\n- Remove items where supported.\n\n**System actions**\n- Expose list, PDF, and status APIs for ERP items.\n\n**States**\n- `erezept_sent`\n- `erezept_removed`\n- `erezept_resend_pending`\n\n## 3. Branches And Edge Cases\n- Standard form prescription vs e-prescription branch split after shopping-bag or form preparation.\n- Medication can be selected as structured catalog entry or free text.\n- Some form types relax validation: green and private prescriptions do not require the same intake-interval rule as other types.\n- Free-text medication requires a name; otherwise prescribing is blocked.\n- Quantity less than `1` blocks prescribing.\n- Shopping bag can be empty, making prescribe actions unavailable.\n- User may remove individual items or clear the whole recipe pool before saving.\n- Search may require group selection before final medicine selection.\n- Alternate detail flows exist through second-layer dialogs, price comparison, alternatives, and warning surfaces.\n- E-prescription bundle creation can fail before sign/send.\n- Sign/send is not represented as a single visible medication-screen step; it branches into a dedicated ERP, API, and companion path.\n- ERP flow supports abort, resend, remove, and PDF retrieval after creation.\n- Tests show support for partial prescription metadata in ERP payloads, even if that is not clearly surfaced in the main UI flow.\n- Status tracking exists at API and domain level for e-prescriptions, but the visible UI flow in the repo is more explicit for save/print than for full submission lifecycle.\n\n## Audit Conclusion\n- The current as-is flow is best described as `search/select/edit -> shopping bag -> prescribe/save/print`, with `bundle/sign/send/status` as an attached downstream branch.\n- If CorePVS wants a seamless doctor-facing prescription experience, the current split between medication authoring and ERP lifecycle needs to be unified into one continuous workflow surface.\n","mtime":1774157516196.69,"sourcePath":"/Users/vanle/Documents/core-pvs-proto/docs/artifacts/AUDIT260322-prescription-pvs-base.md","folder":"Prescription Unified","navLabel":null},{"filename":"FLOW260322-prescription-unified-workspace.md","content":"# Unified User Flow — Prescription Workspace\n\n## Context\nThis flow is the proposed CorePVS target flow for a seamless doctor-facing prescription experience.\n\nIt is based on:\n- as-is audit of `pvs-base-1`\n- CorePVS prescription direction in `docs/_ngan/2-prescription/`\n- product-context requirement that doctors need compliant E-Rezept with safety checks\n\n## Goal\nUnify the currently split workflow:\n\n`search/select/edit -> shopping bag -> save/print`\n\nand\n\n`bundle/sign/send/status`\n\ninto one continuous doctor workflow.\n\n## Primary Persona\nDoctor.\n\n## End-to-End Flow\n1. Open patient chart and launch `Prescription Workspace`\n2. Review sticky patient context\n3. Search medication\n4. Select medication or free-text mode\n5. Add medication row to workspace\n6. Enter dosage, intake instructions, quantity, and optional notes\n7. Choose prescription form or mode\n   - E-Rezept\n   - Muster 16\n   - private prescription\n   - green prescription\n   - BTM or other specialized forms when relevant\n8. Review automatic recommendation, substitution, and safety feedback\n9. Resolve blocking issues or acknowledge non-blocking warnings\n10. Generate E-Rezept bundle in-place\n11. Review readiness summary\n12. Sign using QES or comfort signature\n13. Send to Fachdienst\n14. Show success state with patient copy and queue actions\n15. Track lifecycle status in the same workspace\n16. Retry, resend, print, or cancel if allowed\n\n## Workflow Moments\n| Workflow moment | Why it matters |\n|---|---|\n| Enter workspace | Keeps patient context, allergies, and insurance visible from the first second |\n| Add medication | Converts search into an editable prescription row without switching surface |\n| Edit prescription details | Main work phase; must stay fast and dense |\n| Safety and recommendation overlay | Must happen inline, not as a separate detached review world |\n| Bundle generation | Technical step should feel like system preparation, not user navigation |\n| Sign | Legal commitment point |\n| Send | External integration point with recoverable failures |\n| Status | Must remain visible after sending without sending the user to another module |\n\n## Screen Sequence\n```mermaid\nflowchart LR\n    A[Patient Chart] --> B[Prescription Workspace]\n    B --> C[Compose]\n    C --> D[Inline Safety and Recommendation Review]\n    D --> E[Bundle Prepared]\n    E --> F[Sign]\n    F --> G[Send]\n    G --> H[Post-Send Status]\n    H --> H\n```\n\n## State Transitions\n```mermaid\nstateDiagram-v2\n    [*] --> Draft\n    Draft --> Incomplete\n    Incomplete --> Draft\n    Draft --> ReadyForBundle\n    ReadyForBundle --> BundlePreparing\n    BundlePreparing --> BundleFailed\n    BundlePreparing --> ReadyToSign\n    BundleFailed --> Draft\n    ReadyToSign --> Signing\n    Signing --> SignFailed\n    Signing --> ReadyToSend\n    SignFailed --> ReadyToSign\n    ReadyToSend --> Sending\n    Sending --> SendFailed\n    Sending --> Sent\n    SendFailed --> ReadyToSend\n    Sent --> Dispensed\n    Sent --> Cancelled\n```\n\n## User Actions\n- Search medication\n- Select result or free-text prescription mode\n- Edit row fields inline\n- Change form type\n- Review safety warnings\n- Accept warning override where allowed\n- Save draft\n- Generate bundle\n- Sign\n- Send\n- Print patient copy\n- Retry failed bundle, sign, or send\n- View current status\n- Cancel if permitted\n\n## System Actions\n- Load patient context, current medication, allergies, insurance, and relevant history\n- Fetch medication results and recommendation metadata\n- Validate row completeness and form-specific prerequisites\n- Run safety checks continuously\n- Auto-generate readiness summary\n- Generate bundle without forcing navigation away from the workspace\n- Lock signed data\n- Send signed bundle to Fachdienst\n- Refresh lifecycle status after send\n- Surface actionable errors and recovery paths\n\n## Branches\n- Catalog medication vs free-text medication\n- E-Rezept vs paper or non-ERP form branch\n- Single prescription vs multiple rows in one workspace session\n- Individual sign/send vs batch sign/send\n- Comfort signature available vs explicit QES prompt required\n- Send success vs recoverable send failure\n- Sent but not dispensed vs dispensed vs cancelled\n\n## Edge Cases\n- Drug search unavailable\n- Free-text medication missing required name\n- Quantity invalid\n- Intake interval missing for form types that require it\n- Severe interaction blocks bundle/sign\n- Warning interaction allows proceed with acknowledgement\n- Bundle generation fails because required fields are incomplete\n- Signing fails because TI or certificate state is invalid\n- Sending fails because connector, network, or Fachdienst request is rejected\n- Status refresh unavailable after send\n- Cancellation requested after dispensing and must be blocked\n\n## Audit-To-Target Shift\n- As-is `pvs-base-1` splits form prescription from ERP lifecycle\n- Target CorePVS flow keeps authoring, readiness, signing, sending, and status in one workspace\n- The user should experience the ERP lifecycle as part of the prescription workflow, not as a separate technical submodule\n","mtime":1774155526612.9124,"sourcePath":"/Users/vanle/Documents/core-pvs-proto/docs/artifacts/FLOW260322-prescription-unified-workspace.md","folder":"Prescription Unified","navLabel":null},{"filename":"SCRN260322-prescription-unified-workspace.md","content":"# Screen Spec — Prescription Unified Workspace\n\n## Purpose\nA single prescribing workstation that keeps compose, review, E-Rezept preparation, signing, sending, and status in one continuous surface.\n\n## Core Layout\n```text\n+------------------------------------------------------------------------------------------------------+\n| Sticky Patient Header                                                                                |\n|------------------------------------------------------------------------------------------------------|\n| Left Rail                    | Main Workspace                            | Right Rail                |\n| Search and quick picks       | Prescription rows + detail editor         | Readiness and status      |\n|------------------------------------------------------------------------------------------------------|\n| Sticky Action Bar                                                                                   |\n+------------------------------------------------------------------------------------------------------+\n```\n\n## Region 1 — Sticky Patient Header\n### Purpose\nKeep clinically important patient context visible at all times.\n\n### Content\n- patient identity\n- age and sex\n- insurance and contract context\n- allergies and intolerances\n- chronic conditions\n- current medication count\n\n### States\n- default\n- allergy alert highlighted\n- insurance context unavailable\n\n## Region 2 — Left Rail: Search And Quick Picks\n### Purpose\nFast medication search without leaving the workspace.\n\n### Content\n- search input\n- recent medications\n- frequently used medications\n- grouped search results\n- free-text add action\n\n### States\n- idle\n- loading results\n- results loaded\n- no results\n- drug-db unavailable\n\n### Key Rules\n- keyboard focus defaults here on open\n- no modal required for first selection\n- selecting a result creates or updates a prescription row in the main workspace\n\n## Region 3 — Main Workspace: Prescription Rows\n### Purpose\nPrimary authoring area for all prescription details.\n\n### Row Model\nEach medication row contains:\n- medication identity\n- form type\n- dosage\n- intake instructions\n- quantity\n- notes\n- substitution flags\n- per-row status chip\n\n### Row States\n- empty row\n- editing\n- incomplete\n- warning\n- ready\n- signed and locked\n- sent and locked\n\n### Key Rules\n- inline editing only\n- no detached review screen for routine edits\n- signed rows become read-only\n- sent rows become immutable except permitted follow-up actions\n\n## Region 4 — Right Rail: Readiness, Safety, And Lifecycle\n### Purpose\nMake system preparation and lifecycle visible without sending the user away.\n\n### Sections\n- readiness checklist\n- safety panel\n- recommendation and substitution panel\n- bundle state\n- signing state\n- sending state\n- status timeline\n\n### States\n- checklist incomplete\n- warning present\n- bundle preparing\n- bundle failed\n- ready to sign\n- signing\n- sign failed\n- ready to send\n- sending\n- sent\n- send failed\n- dispensed\n- cancelled\n\n### Key Rules\n- severe safety issues block downstream CTA\n- non-blocking warnings stay visible after acknowledgement\n- status timeline remains visible after successful send\n\n## Region 5 — Sticky Action Bar\n### Purpose\nExpose the next best action according to workspace state.\n\n### Primary CTA By State\n| State | Primary CTA |\n|---|---|\n| `draft` / `incomplete` | `Save draft` |\n| `ready_for_bundle` | `Prepare E-Rezept` |\n| `ready_to_sign` | `Sign` |\n| `ready_to_send` | `Send to Fachdienst` |\n| `sent` | `Print patient copy` |\n\n### Secondary Actions\n- discard row\n- remove from workspace\n- retry bundle\n- retry sign\n- retry send\n- cancel prescription\n- open status details\n\n## Screen-Level States\n### Empty\n- no medication rows yet\n- message guides user to search or add free text\n\n### Loading\n- patient context loading\n- medication results loading\n- readiness loading\n- bundle or send progress\n\n### Error\n- drug database unavailable\n- ERP bundle creation failed\n- signing failed\n- send failed\n- status refresh failed\n\n### Populated\n- one or more prescription rows present\n- right rail reflects current readiness and lifecycle state\n\n## Validation Rules\n- required fields vary by form type\n- free-text prescription requires medication name\n- some non-ERP forms can save and print without ERP preparation\n- E-Rezept requires bundle-ready state before sign\n- send requires signed bundle\n\n## Interaction Rules\n- no mandatory screen switch between compose and sign/send\n- true blocking events only for legal and safety gates\n- all other guidance appears inline or in right rail\n- the same workspace must remain the post-submit status surface\n\n## Success Criteria\n- doctor can finish a typical E-Rezept without leaving the workspace\n- status remains visible after send\n- failures provide an immediate retry path in the same place\n- workspace supports both single-item and multi-item prescribing sessions\n","mtime":1774155526613.0828,"sourcePath":"/Users/vanle/Documents/core-pvs-proto/docs/artifacts/SCRN260322-prescription-unified-workspace.md","folder":"Prescription Unified","navLabel":null},{"filename":"WIRE260322-prescription-unified-workspace.md","content":"# Wireframe — Prescription Unified Workspace\n\n## Overall Desktop Wireframe\n\n```text\n+====================================================================================================================+\n| PATIENT HEADER                                                                                                     |\n| Name | DOB | Insurance | Schein | Allergies | Chronic conditions | Current meds | ERP mode                         |\n+====================================================================================================================+\n| SEARCH / QUICK PICKS            | PRESCRIPTION WORKSPACE                                    | READINESS / STATUS    |\n|---------------------------------|-----------------------------------------------------------|-----------------------|\n| [ Search medication........ ]   | [ Row 1 ] Ibuprofen 400mg                        [Ready]   | Readiness Checklist   |\n|                                 | Form: E-Rezept   Qty: 1   Intake: 1-0-1-0                | - patient ok          |\n| Recent                          | Notes: with food                                      v   | - form complete       |\n| - Metformin                     |-----------------------------------------------------------| - bundle prepared     |\n| - Ramipril                      | Expanded Row                                            | - signed              |\n|                                 | Dosage .................... [___________]                | - sent                |\n| Frequent                        | Instructions .............. [___________]                |                       |\n| - Pantoprazol                   | Quantity .................. [ 1 ]                        | Safety                |\n| - Novaminsulfon                 | Timing / interval ......... [___________]                | [Yellow] interaction  |\n|                                 | Notes ..................... [___________]                | [Green] allergy check |\n| Results                         | Aut-idem [ ]   As needed [ ]                            |                       |\n| > Ibuprofen 400mg               |-----------------------------------------------------------| Recommendation        |\n|   tablet | N1 | warning icon    | [ Row 2 ] Free-text medication                  [Draft]   | Cheapest generic      |\n| > Aspirin 500mg                 | Form: Muster 16   Qty: 1   Intake: missing               | Contract note         |\n| > Add free-text                 |-----------------------------------------------------------|                       |\n|                                 |                                                           | Bundle / Sign / Send  |\n|                                 |                                                           | Bundle: Ready         |\n|                                 |                                                           | Sign: Not started     |\n|                                 |                                                           | Send: Not started     |\n|                                 |                                                           |                       |\n|                                 |                                                           | Status Timeline       |\n|                                 |                                                           | Draft -> Signed ->    |\n|                                 |                                                           | Sent -> Dispensed     |\n+--------------------------------------------------------------------------------------------------------------------+\n| [Save draft] [Prepare E-Rezept] [Sign] [Send to Fachdienst] [Print patient copy] [Cancel if allowed]             |\n+--------------------------------------------------------------------------------------------------------------------+\n```\n\n## State Variant A — Incomplete\n\n```text\n+--------------------------------------------------------------------------------------------------------------+\n| Row status: [Incomplete]                                                                                    |\n| Missing: intake interval, form-specific required field                                                      |\n| Right rail: checklist shows red items                                                                       |\n| Action bar: `Prepare E-Rezept`, `Sign`, and `Send` disabled                                                 |\n+--------------------------------------------------------------------------------------------------------------+\n```\n\n## State Variant B — Ready To Sign\n\n```text\n+--------------------------------------------------------------------------------------------------------------+\n| Row status: [Ready to sign]                                                                                 |\n| Right rail: checklist all green, bundle prepared                                                            |\n| Action bar primary: [Sign]                                                                                  |\n+--------------------------------------------------------------------------------------------------------------+\n```\n\n## State Variant C — Signing In Progress\n\n```text\n+--------------------------------------------------------------------------------------------------------------+\n| Workspace stays visible                                                                                     |\n| Right rail shows: `Signing... connect eHBA / comfort signature`                                             |\n| Main rows temporarily read-only                                                                             |\n| Action bar primary disabled until result                                                                    |\n+--------------------------------------------------------------------------------------------------------------+\n```\n\n## State Variant D — Send Failed\n\n```text\n+--------------------------------------------------------------------------------------------------------------+\n| Right rail error card                                                                                       |\n| `Transmission failed: connector timeout`                                                                    |\n| Actions: [Retry send] [Save draft] [Print paper fallback if policy allows]                                 |\n| User stays in the same workspace                                                                            |\n+--------------------------------------------------------------------------------------------------------------+\n```\n\n## State Variant E — Post-Send Status\n\n```text\n+--------------------------------------------------------------------------------------------------------------+\n| Workspace header chip: [Sent]                                                                               |\n| Right rail timeline: Draft -> Bundle prepared -> Signed -> Sent                                             |\n| Follow-up actions: [Print patient copy] [View PDF] [Resend] [Cancel if allowed]                            |\n+--------------------------------------------------------------------------------------------------------------+\n```\n\n## Layout Notes\n- Left rail stays narrow and optimized for search throughput.\n- Main workspace is the dominant region and should support multiple rows.\n- Right rail is persistent and acts as the system-awareness column.\n- Sticky footer keeps the next action visible throughout the workflow.\n\n## UX Intent\n- Keep the doctor in one mental workspace.\n- Treat bundle, sign, and send as state transitions inside the same flow, not navigation events.\n- Keep post-send status in the same surface so the workflow feels complete instead of handed off.\n","mtime":1774155526613.2124,"sourcePath":"/Users/vanle/Documents/core-pvs-proto/docs/artifacts/WIRE260322-prescription-unified-workspace.md","folder":"Prescription Unified","navLabel":null},{"filename":"FLOW260319-gpro-master-workflow.md","content":"---\nVersion: 2.0\nLast Updated: 2026-03-19\nScope: As-built from codebase analysis of tini-works/pvs-base-1 (ext/tui/)\n---\n\n# gPRO (TUI) User Workflow Diagrams\n\nDerived from the gPRO TUI codebase (tini-works/pvs-base-1). Each diagram shows **user goals → steps → decision points → outcomes**. Screens (IA260319-gpro-screen-inventory.md) are derived from these workflows.\n\n**Convention:** `==>` primary/happy path. `-->` alternate path. `-.->` edge case / optional.\n\n---\n\n## Workflow Index\n\n| # | Workflow | Trigger | Role | Screens Required |\n|---|---|---|---|---|\n| WF-1 | Authentication & Session Setup | App launch, no valid token | All | G001, G002 |\n| WF-2 | Select a Patient | User navigates to Patients page | All | G003 |\n| WF-3 | Select a Schein | User navigates to Scheins page | All | G004 |\n| WF-4 | Browse Timeline Entries | User navigates to Timelines page | All | G005 |\n| WF-5 | Create a Timeline Entry | User opens QuickEntry (`:` key) | All | G005, G006 |\n| WF-6 | Logout | User triggers Logout from sidebar | All | G001 |\n\n---\n\n## WF-1 — Authentication & Session Setup\n\n**Goal:** Establish a valid, authenticated session so the user can access patient data.\n\n```mermaid\nflowchart TD\n    START([\"Launch gPRO\"])\n    START ==>|\"Load config\"| CONN[\"Connect to Backend\"]\n\n    CONN --> CONN_RESULT{\"Connection\\nSuccessful?\"}\n    CONN_RESULT -->|\"Failed\"| CONN_ERR[\"Connection Error\\n(retry shown)\"]\n    CONN_ERR -.->|\"Auto-retry\"| CONN\n\n    CONN_RESULT ==>|\"Connected\"| AUTH_CHECK{\"Valid Token\\nFound?\"}\n\n    AUTH_CHECK -->|\"No\"| AUTH_SCREEN[\"G001: Auth Overlay\\n(login URL displayed)\"]\n    AUTH_CHECK ==>|\"Yes\"| PROFILE[\"Resolve User Profile\"]\n\n    subgraph LoginFlow[\"G001: Login States\"]\n        URL_SHOWN[\"Login URL Displayed\"]\n        USER_ACTION[\"User Opens URL in Browser\"]\n        WAITING[\"Waiting for Login Callback\"]\n        LOGIN_OK[\"Login Successful\"]\n        LOGIN_FAIL[\"Login Failed\"]\n\n        URL_SHOWN ==>|\"User opens browser\"| USER_ACTION\n        URL_SHOWN -->|\"c: copy URL\"| USER_ACTION\n        USER_ACTION ==> WAITING\n        WAITING ==>|\"Callback received\"| LOGIN_OK\n        WAITING -->|\"Error / timeout\"| LOGIN_FAIL\n        LOGIN_FAIL -.->|\"User retries\"| URL_SHOWN\n    end\n\n    AUTH_SCREEN ==> URL_SHOWN\n    LOGIN_OK ==> PROFILE\n\n    subgraph ProfileLoad[\"G002: Profile Resolution States\"]\n        RESOLVING[\"Resolving User Identity\"]\n        RESOLVED[\"Identity Confirmed\"]\n        LOAD_PROF[\"Loading User Profile\"]\n        PROF_READY[\"Profile Ready\"]\n        PROF_ERR[\"Resolution Failed\"]\n\n        RESOLVING ==>|\"Identity found\"| RESOLVED\n        RESOLVING -->|\"Not found\"| PROF_ERR\n        RESOLVED ==> LOAD_PROF\n        LOAD_PROF ==>|\"Success\"| PROF_READY\n        LOAD_PROF -->|\"Error\"| PROF_ERR\n    end\n\n    PROFILE ==> RESOLVING\n    PROF_READY ==> READY([\"Session Ready\\n→ G002: Home Page\"])\n```\n\n---\n\n## WF-2 — Select a Patient\n\n**Goal:** Set a patient in context so Scheins and Timeline entries can be loaded for them.\n\n```mermaid\nflowchart TD\n    START([\"Navigate to Patients\\n(key 2 or sidebar)\"])\n    START ==> LOAD[\"Load Patient List\\n(paginated, 20 per page)\"]\n\n    LOAD --> LOAD_RESULT{\"Load\\nSuccessful?\"}\n    LOAD_RESULT ==>|\"Patients found\"| TABLE[\"G003: Patients List\\n(table with rows)\"]\n    LOAD_RESULT -->|\"Empty\"| EMPTY[\"No Patients Found\"]\n    LOAD_RESULT -->|\"Error\"| ERR[\"Load Error\\n(re-navigate to retry)\"]\n\n    subgraph Browse[\"Browse & Paginate\"]\n        SCROLL[\"Scroll rows (↑/↓)\"]\n        NEXT_PAGE[\"Next page (n)\"]\n        PREV_PAGE[\"Previous page (p)\"]\n    end\n\n    TABLE ==> SCROLL\n\n    SCROLL ==>|\"Enter\"| SELECT_CHECK{\"Already\\nSelected?\"}\n    SELECT_CHECK ==>|\"No\"| SELECT[\"Set as Active Patient\\n(✓ marker shown)\"]\n    SELECT_CHECK -->|\"Yes\"| DESELECT[\"Deselect Patient\\n(✓ removed)\"]\n\n    SELECT ==> CONTEXT[\"Patient in Context:\\n• Schein selection cleared\\n• Scheins page queued to reload\\n• Timeline page queued to reload\"]\n\n    CONTEXT ==> DONE([\"Patient Selected\\n→ Ready for WF-3\"])\n\n    TABLE --> NEXT_PAGE\n    TABLE --> PREV_PAGE\n    NEXT_PAGE --> TABLE\n    PREV_PAGE --> TABLE\n```\n\n---\n\n## WF-3 — Select a Schein\n\n**Goal:** Set a Schein in context so Timeline entries can be scoped to the correct billing record.\n\n```mermaid\nflowchart TD\n    START([\"Navigate to Scheins\\n(key 3 or sidebar)\"])\n    START ==> PREREQ{\"Patient\\nSelected?\"}\n\n    PREREQ -->|\"No\"| NO_PAT[\"Prompt: Select a patient first\\n(no data loads)\"]\n    NO_PAT -.->|\"User goes to Patients page\"| WF2[\"→ WF-2: Select a Patient\"]\n\n    PREREQ ==>|\"Yes\"| LOAD[\"Load Scheins for Active Patient\"]\n\n    LOAD --> LOAD_RESULT{\"Load\\nSuccessful?\"}\n    LOAD_RESULT ==>|\"Scheins found\"| TABLE[\"G004: Scheins List\\n(table with rows)\"]\n    LOAD_RESULT -->|\"Empty\"| EMPTY[\"No Scheins for This Patient\"]\n    LOAD_RESULT -->|\"Error\"| ERR[\"Load Error\"]\n\n    subgraph ScheinRow[\"Each Row Shows\"]\n        TYPE[\"Type: KV | BG | Private | HZV | FAV | IGEL\"]\n        CASE[\"Treatment Case: Outpatient | Referral | Emergency | etc.\"]\n        QUARTER[\"Quarter: Q#/YYYY\"]\n        STATUS[\"Status: Normal | Printed | Billed | Cancelled\"]\n    end\n\n    TABLE ==> SCROLL[\"Scroll rows (↑/↓)\"]\n\n    SCROLL ==>|\"Enter\"| SELECT_CHECK{\"Already\\nSelected?\"}\n    SELECT_CHECK ==>|\"No\"| SELECT[\"Set as Active Schein\\n(✓ marker shown)\"]\n    SELECT_CHECK -->|\"Yes\"| DESELECT[\"Deselect Schein\\n(✓ removed)\"]\n\n    SELECT ==> CONTEXT[\"Schein in Context:\\n• Timeline page queued to reload\\n• QuickEntry now enabled\"]\n\n    CONTEXT ==> DONE([\"Schein Selected\\n→ Ready for WF-4 / WF-5\"])\n\n    subgraph AutoReload[\"Auto-Reload Trigger\"]\n        PAT_CHANGED[\"Patient Changed → Reload Scheins\\nfor New Patient Automatically\"]\n        PAT_CLEARED[\"Patient Cleared → Clear Schein Table\\n+ Clear Active Schein\"]\n    end\n```\n\n---\n\n## WF-4 — Browse Timeline Entries\n\n**Goal:** Review the clinical history for the active patient and schein.\n\n```mermaid\nflowchart TD\n    START([\"Navigate to Timelines\\n(key 4 or sidebar)\"])\n    START ==> PREREQ{\"Patient +\\nSchein Selected?\"}\n\n    PREREQ -->|\"No\"| NO_PREREQ[\"Prompt: Select a patient\\nand schein first\"]\n    NO_PREREQ -.->|\"User completes WF-2/WF-3\"| START\n\n    PREREQ ==>|\"Yes\"| LOAD[\"Load Timeline Entries\\n(2 quarters per page)\"]\n\n    LOAD --> LOAD_RESULT{\"Load\\nSuccessful?\"}\n    LOAD_RESULT ==>|\"Entries found\"| TABLE[\"G005: Timeline View\\n(date | type | description | quarter)\"]\n    LOAD_RESULT -->|\"Empty\"| EMPTY[\"No Entries for This Patient/Schein\"]\n    LOAD_RESULT -->|\"Error\"| ERR[\"Load Error\\n(press r to reload)\"]\n\n    TABLE ==> SCROLL[\"Scroll rows (↑/↓)\"]\n\n    SCROLL ==>|\"Enter\"| DETAIL[\"View Entry Detail\\n(detail panel opens)\"]\n    DETAIL -->|\"Esc\"| SCROLL\n\n    subgraph InfiniteScroll[\"Infinite Scroll\"]\n        AT_BOTTOM[\"User Scrolls to Bottom\"]\n        LOAD_MORE[\"Load Older Entries\\n(next page appended)\"]\n        ALL_LOADED[\"All Entries Loaded\\n(no more pages)\"]\n\n        AT_BOTTOM ==>|\"More pages\"| LOAD_MORE\n        AT_BOTTOM -->|\"Last page\"| ALL_LOADED\n        LOAD_MORE ==> SCROLL\n    end\n\n    SCROLL --> AT_BOTTOM\n\n    TABLE -->|\"r\"| RELOAD[\"Reload from Page 1\\n(clears + refetches)\"]\n    RELOAD ==> TABLE\n\n    TABLE ==>|\":\"| QE[\"Open QuickEntry\\n→ WF-5\"]\n```\n\n---\n\n## WF-5 — Create a Timeline Entry\n\n**Goal:** Document a clinical event (diagnosis, service, or note) against the active patient and schein.\n\n**Prerequisite:** Patient selected (WF-2) AND Schein selected (WF-3).\n\n```mermaid\nflowchart TD\n    START([\"Press ':' on\\nTimelines Page (G005)\"])\n    START ==> QE_OPEN[\"G006: QuickEntry Input\\n(opens at bottom of screen)\"]\n\n    QE_OPEN ==> PREFIX{\"Type Prefix\"}\n\n    PREFIX ==>|\"d: or diag:\"| DIAG[\"Diagnosis Search Mode\\n(ICD-10)\"]\n    PREFIX -->|\"s: or service:\"| SVC[\"Service Search Mode\\n(EBM)\"]\n    PREFIX -->|\"n: or note:\"| NOTE[\"Freetext Note Mode\"]\n    PREFIX -->|\"Esc\"| CANCEL([\"QuickEntry Closed\\n→ Return to Timeline\"])\n\n    subgraph DiagSearch[\"Diagnosis Search (ICD-10)\"]\n        D_TYPE[\"User types ICD code or term\\n(e.g. d:J06)\"]\n        D_RESULTS[\"Suggestions appear\\n(code + description, up to 10)\"]\n        D_NAV[\"Navigate with ↑/↓\"]\n        D_SELECT[\"Tab: autocomplete input\\nEnter: submit selected\"]\n\n        D_TYPE ==>|\"Debounced search\"| D_RESULTS\n        D_RESULTS ==> D_NAV\n        D_NAV ==> D_SELECT\n    end\n\n    DIAG ==> D_TYPE\n\n    subgraph SvcSearch[\"Service Search (EBM)\"]\n        S_TYPE[\"User types GNR code or term\\n(e.g. s:01100)\"]\n        S_RESULTS[\"Suggestions appear\\n(code + service name, up to 10)\"]\n        S_NAV[\"Navigate with ↑/↓\"]\n        S_SELECT[\"Tab: autocomplete input\\nEnter: submit selected\"]\n\n        S_TYPE ==>|\"Debounced search\"| S_RESULTS\n        S_RESULTS ==> S_NAV\n        S_NAV ==> S_SELECT\n    end\n\n    SVC ==> S_TYPE\n\n    NOTE ==>|\"Enter\"| SUBMIT\n\n    D_SELECT ==>|\"Enter\"| SUBMIT[\"Submit Entry to Backend\"]\n    S_SELECT ==>|\"Enter\"| SUBMIT\n\n    SUBMIT --> SUBMIT_RESULT{\"Saved\\nSuccessfully?\"}\n    SUBMIT_RESULT ==>|\"Success\"| RELOAD[\"Timeline Reloads\\n(new entry visible)\"]\n    SUBMIT_RESULT -->|\"Error\"| QE_ERR[\"Error shown in QuickEntry bar\\n(input preserved)\"]\n    QE_ERR -.->|\"User edits and retries\"| QE_OPEN\n\n    RELOAD ==> DONE([\"Entry Created\\nQuickEntry clears,\\nstays open for next entry\"])\n    DONE -.->|\"Add another\"| QE_OPEN\n    DONE -->|\"Esc\"| CLOSE([\"QuickEntry Closed\\n→ Return to Timeline\"])\n```\n\n---\n\n## WF-6 — Logout\n\n**Goal:** End the current session and return the app to the login state.\n\n```mermaid\nflowchart TD\n    START([\"Select 'Logout'\\nfrom Sidebar\"])\n\n    START ==> CLEAR_TOKEN[\"Clear Access Token\\n+ User Credentials\"]\n    CLEAR_TOKEN ==> CLEAR_STATE[\"Clear Active Context:\\n• Selected Patient removed\\n• Selected Schein removed\\n• All page data cleared\"]\n    CLEAR_STATE ==> RESET[\"Return to Home Page\"]\n    RESET ==> SHOW_AUTH[\"G001: Auth Overlay Appears\\n(new login required)\"]\n    SHOW_AUTH ==> WAITING([\"Waiting for\\nNew Authentication\\n→ WF-1\"])\n```\n\n---\n\n## End-to-End — Full Clinical Documentation Session\n\n```mermaid\nflowchart TD\n    START([\"Launch gPRO\"])\n\n    subgraph Auth[\"WF-1: Authenticate\"]\n        A1[\"Check for valid token\"]\n        A2{\"Token valid?\"}\n        A3[\"G001: Auth Overlay → Login via browser\"]\n        A4[\"G002: Home Page\"]\n        A1 ==> A2\n        A2 -->|\"No\"| A3\n        A2 ==>|\"Yes\"| A4\n        A3 ==>|\"Login success\"| A4\n    end\n\n    subgraph SelectPat[\"WF-2: Select Patient\"]\n        B1[\"G003: Patients List (key 2)\"]\n        B2[\"Browse list → Enter to select\"]\n        B1 ==> B2\n    end\n\n    subgraph SelectSchein[\"WF-3: Select Schein\"]\n        C1[\"G004: Scheins List (key 3)\"]\n        C2[\"Browse list → Enter to select\"]\n        C1 ==> C2\n    end\n\n    subgraph Document[\"WF-4 + WF-5: Review & Document\"]\n        D1[\"G005: Timeline View (key 4)\"]\n        D2[\"Browse entries (↑/↓, infinite scroll)\"]\n        D3[\"Open QuickEntry (:)\"]\n        D4[\"G006: Add diagnosis (d:), service (s:), or note (n:)\"]\n        D5[\"Submit → Timeline reloads\"]\n        D1 ==> D2\n        D2 ==>|\":\"| D3\n        D3 ==> D4 ==> D5 ==> D2\n    end\n\n    START ==> A1\n    A4 ==> B1\n    B2 ==> C1\n    C2 ==> D1\n\n    D2 -->|\"Done\"| END{\"End Session?\"}\n    END -->|\"New patient\"| B1\n    END -->|\"WF-6: Logout\"| LOGOUT[\"Sidebar → Logout → G001: Auth Overlay\"]\n    END ==>|\"Quit\"| QUIT([\"q / Ctrl+C → Exit\"])\n```\n","mtime":1774151373580.1313,"sourcePath":"/Users/vanle/Documents/core-pvs-proto/docs/_ngan/garrioPRO/FLOW260319-gpro-master-workflow.md","folder":"AUDIT","navLabel":null},{"filename":"FLOW260320-gpro-workflow-compliance-aligned.md","content":"---\nVersion: 1.1\nLast Updated: 2026-03-20\nScope: Translation of FLOW260319-gpro-user-workflow-detail.md into compliance-aligned style\nSource: gPRO TUI codebase (pvs-base-1) → rewritten with natural language + compliance IDs\n---\n\n# gPRO Workflows — Compliance-Aligned Translation\n\nTranslated from `FLOW260319-gpro-user-workflow-detail.md` (as-built from pvs-base-1 codebase). Each block uses natural language and maps to compliance inventory IDs where applicable.\n\n**Convention:**\n- `==>` primary/happy path. `-->` alternate path. `-.->` edge case / optional.\n- `(ID)` = compliance inventory reference. Blocks without IDs = no compliance mapping found.\n- Only **user goals, decisions, compliance actions, and meaningful outcomes** are shown. UI mechanics (pagination, keyboard shortcuts, scroll behavior) are omitted.\n\n---\n\n## Workflow Index\n\n| # | Workflow | Compliance Areas Touched | Coverage |\n|---|---|---|---|\n| WF-1 | Authentication & Session Setup | ALLG (general software requirements) | Minimal — infrastructure only |\n| WF-2 | Select a Patient | KVDT Patient Data (KP2/P2), PSDV | Partial — read-only display, no card read |\n| WF-3 | Select a Schein | KVDT Patient Data (KP2-500, P2-501) | Partial — list/select only, no creation rules |\n| WF-4 | Browse Timeline Entries | ABRD659 (patient documentation) | Partial — display only |\n| WF-5 | Create a Timeline Entry | ICD-10-GM (P10), KBV EBM (#306-319), KVDT Service (P2-600+), ABRD | Low — basic entry, missing all validation |\n| WF-6 | Logout | None | N/A — session management only |\n\n---\n\n## WF-1 — Authentication & Session Setup\n\n**Goal:** Establish a valid session so the user can access patient data.\n\n**Compliance relevance:** Low. Authentication is infrastructure. Some ALLG items apply indirectly (ALLG799 user manual, ALLG824 change documentation).\n\n```mermaid\nflowchart TD\n    START([\"Launch Application\"])\n    START ==> CONN{\"Backend\\nReachable?\"}\n\n    CONN -->|\"No\"| CONN_ERR[\"Connection Error\\n(auto-retry)\"]\n    CONN_ERR -.->|\"Retry\"| CONN\n\n    CONN ==>|\"Yes\"| AUTH{\"Valid Session\\nExists?\"}\n\n    AUTH -->|\"No\"| LOGIN[\"User Logs In\\nvia Browser\"]\n    AUTH ==>|\"Yes\"| PROFILE[\"Resolve User Identity\\n& Load Profile\"]\n\n    LOGIN ==> LOGIN_RESULT{\"Login\\nSuccessful?\"}\n    LOGIN_RESULT ==>|\"Yes\"| PROFILE\n    LOGIN_RESULT -->|\"Failed\"| LOGIN\n\n    PROFILE ==> PROF_RESULT{\"Identity\\nConfirmed?\"}\n    PROF_RESULT ==>|\"Yes\"| READY([\"Session Ready\\n→ Home Page\"])\n    PROF_RESULT -->|\"Not Found\"| PROF_ERR[\"Identity Resolution Failed\"]\n```\n\n### Compliance Gaps in WF-1\n\n| Gap | Compliance Ref | Description |\n|-----|---------------|-------------|\n| No HÄEVG-ID management | ALLG657 | System should manage HÄEVG-ID per physician during profile resolution |\n| No VP-ID type management | ALLG1850 | System should manage VP-ID types (GP \"H\", specialist \"F\", care team \"B\") |\n| No VP-ID retrieval via HPM | ALLG1851, ALLG1852 | If physician has HÄEVG-ID but no VP-ID, system should retrieve via HPM |\n\n---\n\n## WF-2 — Select a Patient\n\n**Goal:** Set a patient in context so Scheins and Timeline entries can be loaded.\n\n**Compliance relevance:** Medium. gPRO displays patient data read-only (loaded from backend). Does not perform card reading or VSDM verification.\n\n```mermaid\nflowchart TD\n    START([\"Navigate to Patient List\"])\n    START ==> LOAD{\"Patients\\nLoaded?\"}\n\n    LOAD ==>|\"Yes\"| TABLE[\"Display Patient List\\n(name, DOB, insurance)\\n(P2-105, P2-200)\"]\n    LOAD -->|\"Empty\"| EMPTY[\"No Patients Found\"]\n    LOAD -->|\"Error\"| ERR[\"Load Error\"]\n\n    TABLE ==> SELECT[\"Select a Patient\"]\n\n    SELECT ==> CONTEXT[\"Patient in Context:\\n• Schein selection cleared\\n• Related data reloaded\"]\n\n    CONTEXT ==> DONE([\"Patient Selected\\n→ Ready for WF-3\"])\n```\n\n### Compliance Gaps in WF-2\n\ngPRO only displays pre-loaded patient data. All card reading, VSDM, and data entry happen in the web app.\n\n| Gap | Compliance Ref | Description |\n|-----|---------------|-------------|\n| No eGK/KVK card reading | KP2-100 | Patient data must be capturable from card terminals |\n| No legacy KVK rejection | KP2-101, KP2-121 | Legacy KVK must be rejected for statutory insured since 01/2015 |\n| No manual data transfer | KP2-102 | Manual transfer from rejected/mobile cards not supported |\n| No field-level controls | KP2-185 | Card data fields should distinguish official (read-only) vs user-editable |\n| No VSDM online verification | KP2-190 | VSDM proof status (FK 4136) must be captured |\n| No VSDM timestamp validation | KP2-191 | Timestamp must be validated against current quarter; under-18 auto fee-exempt |\n| No card read date capture | P2-135 | FK 4109 must be auto-captured, read-only |\n| No card read date propagation | P2-136, P2-150 | Re-read must update FK 4109 across all billing records |\n| No insurance coverage check | P2-140, P2-166 | Coverage validity must be verified; alert if expired |\n| No cost carrier resolution | P2-200, P2-210, P2-220, P2-230, P2-260 | Full cost carrier lifecycle (active/dissolved/merged/invalid IK) |\n| No duplicate patient prevention | KP2-300 | Must match card data against existing records |\n| No insurance change detection | KP2-310, P2-530, P2-535 | Changes must be detected, billing records split |\n| No gender/DOB validation | P2-470, P2-430 | All gender options (incl. diverse) and special DOB ranges |\n| No postal code validation | P2-460 | PLZ must be validated against master data |\n| No KT master data file support | PSDV654 | ehd file support required |\n\n---\n\n## WF-3 — Select a Schein\n\n**Goal:** Set a Schein (billing record) in context so Timeline entries are scoped to the correct billing case.\n\n**Compliance relevance:** Medium. gPRO displays Schein list and types. Does not create Scheins or enforce billing record rules.\n\n```mermaid\nflowchart TD\n    START([\"Navigate to Schein List\"])\n    START ==> PREREQ{\"Patient\\nSelected?\"}\n\n    PREREQ -->|\"No\"| NO_PAT[\"Prompt: Select a Patient First\"]\n    NO_PAT -.->|\"Go to Patient List\"| WF2[\"→ WF-2\"]\n\n    PREREQ ==>|\"Yes\"| LOAD{\"Scheins\\nLoaded?\"}\n\n    LOAD ==>|\"Yes\"| TABLE[\"Display Schein List\\n(type, treatment case,\\nquarter, status)\"]\n    LOAD -->|\"Empty\"| EMPTY[\"No Scheins for This Patient\"]\n    LOAD -->|\"Error\"| ERR[\"Load Error\"]\n\n    TABLE ==> SELECT[\"Select a Schein\"]\n\n    SELECT ==> CONTEXT[\"Schein in Context:\\n• Timeline reloaded\\n• Entry creation enabled\"]\n\n    CONTEXT ==> DONE([\"Schein Selected\\n→ Ready for WF-4 / WF-5\"])\n```\n\n### Compliance Gaps in WF-3\n\n| Gap | Compliance Ref | Description |\n|-----|---------------|-------------|\n| No billing record type selection on first card read | KP2-500 | Satzart 010x selection required on first read per quarter |\n| No multiple 010x records management | P2-501 | Multiple billing records per patient per quarter must be supported |\n| No TSS case marking | KP2-502, KP2-503 | TSS appointment cases must be marked and maintained separately |\n| No TSS referral code capture | KP2-504, KP2-505, KP2-507, KP2-508 | TSS Vermittlungscode, appointment date, referral source |\n| No TSS case completion | KP2-509, P2-510 | TSS Fallabschluss and data integrity |\n| No TSS surcharge calculation | KP2-513 | Time-graded surcharges (A/B/C/D) based on days between referral and appointment |\n| No quarter transition handling | P2-520, P2-521 | Quarter closure, initialization, and case carry-forward |\n| No insurance change within quarter | P2-530, P2-535, P2-540 | Billing record split on insurance/status change |\n| No referral case processing | KP2-560, KP2-561, KP2-562 | Muster 6/10 referral handling |\n| No preventive case marking | ABRD920 | Vorsorge-Behandlungsfall must be flagged |\n| No case type assignment | ABRD921, ABRD968 | Treatment case type rules |\n\n---\n\n## WF-4 — Browse Timeline Entries\n\n**Goal:** Review the clinical history for the active patient and schein.\n\n**Compliance relevance:** Low. Read-only display of existing documentation.\n\n```mermaid\nflowchart TD\n    START([\"Navigate to Timeline\"])\n    START ==> PREREQ{\"Patient +\\nSchein Selected?\"}\n\n    PREREQ -->|\"No\"| NO_PREREQ[\"Prompt: Select Patient\\nand Schein First\"]\n    NO_PREREQ -.->|\"Complete WF-2/WF-3\"| START\n\n    PREREQ ==>|\"Yes\"| LOAD{\"Entries\\nLoaded?\\n(ABRD659)\"}\n\n    LOAD ==>|\"Yes\"| TABLE[\"Display Timeline\\n(date | type | description | quarter)\"]\n    LOAD -->|\"Empty\"| EMPTY[\"No Entries Found\"]\n    LOAD -->|\"Error\"| ERR[\"Load Error\"]\n\n    TABLE ==> VIEW[\"View Entry Detail\"]\n\n    TABLE ==>|\"Create new\"| QE[\"Create Entry\\n→ WF-5\"]\n```\n\n### Compliance Gaps in WF-4\n\n| Gap | Compliance Ref | Description |\n|-----|---------------|-------------|\n| No structured patient documentation display | ABRD659 | Documentation exists as timeline but lacks structured clinical record format |\n| No service-to-diagnosis linkage display | P2-609, P10-029 | Timeline shows entries but no explicit linkage between services and diagnoses |\n| No audit trail for deletions | P2-603, P10-026 | Deleted entries should be audit-logged |\n| No permanent vs acute diagnosis distinction | P10-019, ABRD609 | No visual distinction or carry-forward management |\n| No diagnosis certainty display | P10-003 | V/G/A/Z qualifiers not shown on diagnosis entries |\n| No laterality display | P10-004 | R/L/B not shown on applicable diagnosis entries |\n\n---\n\n## WF-5 — Create a Timeline Entry\n\n**Goal:** Document a clinical event (diagnosis, service, or note) against the active patient and schein.\n\n**Compliance relevance:** **HIGH.** This is the core clinical documentation workflow. Most compliance gaps are here.\n\n**Prerequisite:** Patient selected (WF-2) AND Schein selected (WF-3).\n\n```mermaid\nflowchart TD\n    START([\"Create New Entry\\n(from Timeline)\"])\n    START ==> TYPE{\"Entry Type?\"}\n\n    TYPE ==>|\"Diagnosis\"| DIAG[\"Search ICD-10 Catalog\\n(P10-001)\"]\n    TYPE -->|\"Service\"| SVC[\"Search EBM Catalog\\n(P2-606)\"]\n    TYPE -->|\"Note\"| NOTE[\"Enter Free-Text Note\\n(P2-610, P10-024)\"]\n    TYPE -->|\"Cancel\"| CANCEL([\"Return to Timeline\"])\n\n    subgraph DiagFlow[\"Diagnosis Entry\"]\n        D_SEARCH[\"Search by Code or Description\\n(P10-001)\"]\n        D_RESULTS[\"Display Matching Codes\\n(code + description)\\n(P10-014, P10-030)\"]\n        D_SELECT[\"Select Diagnosis Code\"]\n\n        D_SEARCH ==>|\"Results found\"| D_RESULTS\n        D_RESULTS ==> D_SELECT\n    end\n\n    DIAG ==> D_SEARCH\n\n    subgraph SvcFlow[\"Service Entry\"]\n        S_SEARCH[\"Search by EBM Code or Name\\n(P2-606)\"]\n        S_RESULTS[\"Display Matching Services\\n(code + name)\"]\n        S_SELECT[\"Select Service Code\"]\n\n        S_SEARCH ==>|\"Results found\"| S_RESULTS\n        S_RESULTS ==> S_SELECT\n    end\n\n    SVC ==> S_SEARCH\n\n    D_SELECT ==> SUBMIT[\"Save Entry\\n(P2-600)\"]\n    S_SELECT ==> SUBMIT\n    NOTE ==> SUBMIT\n\n    SUBMIT ==> RESULT{\"Saved?\"}\n    RESULT ==>|\"Yes\"| DONE([\"Entry Created\\n→ Timeline Updated\"])\n    RESULT -->|\"Error\"| ERR[\"Save Error\"] -.->|\"Retry\"| START\n```\n\n### Compliance Gaps in WF-5 — Diagnosis Entry\n\n**Critical (billing-blocking):**\n\n| Gap | Compliance Ref | Description |\n|-----|---------------|-------------|\n| No Diagnosensicherheit (V/G/A/Z) | P10-003, ICD-GM.1-4 | Certainty qualifier must be selectable — KV rejects without it |\n| No terminal code enforcement | P10-008, ABRD611, ABRD612 | Non-terminal (group) codes must trigger warning; confirmed diagnoses ('G') require terminal codes |\n| No ICD validity check against catalog | P10-002, ABRD679 | Code must be validated against current annual catalog version |\n| No diagnoses required per §295 | ABRD608 | At least one diagnosis must be present per billing case |\n\n**Required (audit-relevant):**\n\n| Gap | Compliance Ref | Description |\n|-----|---------------|-------------|\n| No laterality (R/L/B) | P10-004, ICD-GM.7 | Laterality must be selectable for applicable codes |\n| No cross-reference codes (Kreuz-Stern) | P10-005 | Dagger/asterisk pairing must be supported |\n| No exclamation mark code validation | P10-006 | Cannot stand alone — requires primary code |\n| No gender plausibility check | P10-010, ICD-GM.14 | Gender-specific codes must be validated against patient |\n| No age plausibility check | P10-011, ICD-GM.15 | Age-specific codes must be validated against patient |\n| No coding rules (SDKRW) execution | KP10-018, ICD-GM.40-47 | Cross-reference warnings must be applied |\n| No SDICD validation | KP10-016 | SDICD rules must be applied during entry |\n| No retired/deleted code handling | P10-009 | Retired codes must flag with replacement suggestion |\n| No permanent diagnosis management | P10-019, P10-020, ABRD609 | Permanent vs acute distinction and quarter carry-forward |\n| No acute-as-permanent warning | P10-021, ABRD514, ABRD969 | Warning when acute diagnosis marked as permanent |\n| No suspected diagnosis review | P10-022, ABRD887 | Warning when 'V' persists across multiple quarters |\n| No 'Z' marker warning for acute | ABRD786 | 'Z' (Zustand nach) must not be used for acute diseases |\n| No UUU restriction | P10-028, ABRD613 | \"UUU\" only with Auftragsleistung |\n| No diagnosis date capture | P10-023 | Date must be captured and validated |\n| No diagnosis deletion audit | P10-026 | Deletion must be audit-logged |\n| No diagnosis-to-service linkage | P10-029, P2-609 | Explicit linkage for billing justification |\n| No code 0000 (APK) prompt | ABRD456 | System must prompt when no Arzt-Patienten-Kontakt code |\n\n### Compliance Gaps in WF-5 — Service Entry\n\n**Critical (billing-blocking):**\n\n| Gap | Compliance Ref | Description |\n|-----|---------------|-------------|\n| No EBM gender check | #306 (KBV EBM) | Gender-restricted codes must warn on wrong patient gender |\n| No EBM age check | #307 (KBV EBM) | Age-restricted codes must warn when outside range |\n| No EBM frequency limit | #308 (KBV EBM) | Frequency limits per reference period must be enforced |\n| No EBM exclusion rules | #314 (KBV EBM), P2-607 | Same-day/same-case exclusions must be validated |\n| No ICD prerequisite check | #309 (KBV EBM) | Services requiring ICD must block without diagnosis |\n\n**Required (audit-relevant):**\n\n| Gap | Compliance Ref | Description |\n|-----|---------------|-------------|\n| No KV region filter | ABRD603, KP6-809 | Service lookup must filter by KV region |\n| No IK assignment filter | ABRD606 | Service lookup must filter by IK |\n| No IK group filter | ABRD830 | Service lookup must filter by IK group |\n| No doctor specialty gate | #317 (KBV EBM), EBM.4 | Doctor specialty must match EBM code requirements |\n| No service time capture | P2-601 | Time-based codes require time documentation |\n| No service frequency documentation | P2-602 | Mehrfacherbringung must be documentable |\n| No service deletion audit | P2-603 | Deletion must be audit-logged with reason |\n| No OPS code support | ABRD991, ABRD992, P2-617 | OPS codes mandatory when applicable, validity checked |\n| No material cost documentation | ABRD994, P2-618 | Sachkosten with manufacturer/supplier details |\n| No billing justification text | ABRD995, P2-619 | Required for flagged services |\n| No service deletion protection | ABRD607 | Submitted services must be protected from deletion |\n| No contract-specific service catalog | ABRD602, KP6-801 | Services must be filtered by contract |\n| No substitute doctor marking | #313 (KBV EBM), KP6-800 | Substitute LANR required |\n| No TSS surcharge calculation | #321 (KBV TSS), KP2-513 | A/B/C/D surcharges based on appointment timing |\n| No EBM point value display | P2-620 | Service point values from current catalog |\n| No service prerequisites check | P2-608 | Voraussetzungen must be checked |\n\n---\n\n## WF-6 — Logout\n\n**Goal:** End the current session and return to login.\n\n**Compliance relevance:** None. Session management only.\n\n```mermaid\nflowchart TD\n    START([\"Select Logout\"])\n    START ==> END[\"End Session\\n(credentials + context cleared)\"]\n    END ==> LOGIN([\"Return to Login\\n→ WF-1\"])\n```\n\n### Compliance Gaps in WF-6\n\nNone identified. Session management is not directly covered by compliance obligations.\n\n---\n\n## Consolidated Gap Summary\n\n### By Priority\n\n| Priority | Count | Description |\n|----------|-------|-------------|\n| **Critical (billing-blocking)** | 9 | Without these, entries will be rejected at KV billing |\n| **Required (audit-relevant)** | 30+ | Missing = Prüfmodul warnings during billing |\n| **Infrastructure (web app scope)** | 60+ | Card reading, VSDM, billing submission — outside gPRO |\n\n### By Workflow\n\n| Workflow | Compliance IDs Mapped | Gaps Found | Severity |\n|----------|----------------------|------------|----------|\n| WF-1 Auth | 0 mapped | 3 (ALLG) | Low |\n| WF-2 Patient | ~4 display-only | 15+ | Medium — all entry/validation missing |\n| WF-3 Schein | ~2 display-only | 11+ | Medium — no creation/TSS/quarter rules |\n| WF-4 Timeline | ~1 (ABRD659) | 6 | Medium — no structured display |\n| WF-5 Entry | ~5 (basic search/entry) | **40+** | **HIGH — core gaps here** |\n| WF-6 Logout | 0 | 0 | None |\n\n### What This Means for CorePVS\n\n1. **pvs-base-1 (gPRO) covers ~3% of V1 KV compliance** — mostly basic search and display\n2. **WF-5 (Create Entry) is the highest-value reuse target** — the search/select/submit pattern exists, but needs a validation layer added between selection and submission\n3. **WF-2 and WF-3 patterns are reusable** — list/select/context-setting works, but needs card reading and data entry added upstream\n4. **WF-1 and WF-6 are reusable as-is** — authentication and logout have no compliance requirements beyond infrastructure\n5. **File B (master compliance workflows) remains the blueprint** — this file only audits what pvs-base-1 does today\n","mtime":1774151373580.227,"sourcePath":"/Users/vanle/Documents/core-pvs-proto/docs/_ngan/garrioPRO/FLOW260320-gpro-workflow-compliance-aligned.md","folder":"AUDIT","navLabel":null}];
const SCREENSHOTS = {};
const NAV_SECTIONS = [{"label":"Design Pipeline","isSingleItem":true,"docIndices":[0]},{"label":"Prescription Unified","isSingleItem":false,"docIndices":[1,2,3,4]},{"label":"AUDIT","isSingleItem":false,"docIndices":[5,6]}];

const THEME_NAME = "classic";

mermaid.initialize({
  startOnLoad: false,
  theme: 'default',
  securityLevel: 'loose',
  flowchart: { htmlLabels: true, curve: 'basis' },
});

let currentIndex = -1;
let tocVisible = false;
let diagramsOnly = false;
let sortMode = 'modified';
let sortedIndices = [];
const folderState = {};

function buildSortedIndices() {
  sortedIndices = DOCUMENTS.map((_, index) => index);
  if (sortMode === 'name') {
    sortedIndices.sort((a, b) => DOCUMENTS[a].filename.localeCompare(DOCUMENTS[b].filename));
    return;
  }
  sortedIndices.sort((a, b) => DOCUMENTS[b].mtime - DOCUMENTS[a].mtime);
}

function toggleSort() {
  sortMode = sortMode === 'modified' ? 'name' : 'modified';
  document.getElementById('sort-label').textContent = sortMode === 'modified' ? 'Modified' : 'Name';
  populateSidebar();
}

function makeDocButton(docIndex) {
  const doc = DOCUMENTS[docIndex];
  const button = document.createElement('button');
  button.className = doc.folder ? 'doc-item doc-item-nested' : 'doc-item';
  if (docIndex === currentIndex) button.classList.add('active');
  button.textContent = doc.navLabel || doc.filename.replace(/\.md$/i, '').replace(/\.html$/i, '');
  button.title = doc.filename;
  button.onclick = () => selectDocument(docIndex);
  return button;
}

function populateSidebar() {
  buildSortedIndices();
  const list = document.getElementById('doc-list');
  list.innerHTML = '';

  NAV_SECTIONS.forEach((section) => {
    const sectionDocIndices = sortedIndices.filter((docIndex) => section.docIndices.includes(docIndex));
    if (sectionDocIndices.length === 0) return;

    if (section.isSingleItem) {
      list.appendChild(makeDocButton(sectionDocIndices[0]));
      return;
    }

    const expanded = folderState[section.label] !== false;
    const header = document.createElement('div');
    header.className = 'folder-header';
    header.innerHTML = `<span class="folder-toggle">${expanded ? '&#9662;' : '&#9656;'}</span><span class="folder-name">${section.label}</span>`;
    header.onclick = () => {
      folderState[section.label] = !expanded;
      populateSidebar();
    };
    list.appendChild(header);

    if (expanded) {
      sectionDocIndices.forEach((docIndex) => {
        list.appendChild(makeDocButton(docIndex));
      });
    }
  });
}

function selectDocument(index) {
  currentIndex = index;
  populateSidebar();
  renderDocument();
}

function generateTocHtml(content, isHtml) {
  const items = [];
  let match;

  if (isHtml) {
    const htmlHeadingRegex = /<h([1-4])[^>]*>([\s\S]*?)<\/h\1>/gi;
    match = htmlHeadingRegex.exec(content);
    while (match !== null) {
      const level = Number.parseInt(match[1], 10);
      const text = match[2].replace(/<[^>]+>/g, '').trim();
      const id = text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      items.push({ level, text, id });
      match = htmlHeadingRegex.exec(content);
    }
  } else {
    const headingRegex = /^(#{1,4})\s+(.+)$/gm;
    match = headingRegex.exec(content);
    while (match !== null) {
      const level = match[1].length;
      const text = match[2].trim();
      const id = text.toLowerCase().replace(/<[^>]+>/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      items.push({ level, text, id });
      match = headingRegex.exec(content);
    }
  }

  if (items.length === 0) return '';

  let html = '<div class="toc">';
  html += '<div class="toc-title">Table of Contents</div><ul class="toc-list">';
  items.forEach((item) => {
    html += `<li class="toc-h${item.level}"><a href="#${item.id}">${item.text}</a></li>`;
  });
  html += '</ul></div>';
  return html;
}

function renderDocument() {
  if (currentIndex < 0 || currentIndex >= DOCUMENTS.length) return;

  const doc = DOCUMENTS[currentIndex];
  const main = document.getElementById('main-content');
  const isHtml = doc.filename.toLowerCase().endsWith('.html');

  if (diagramsOnly) {
    renderDiagramsOnly(doc, main);
    return;
  }

  const parsedHtml = isHtml ? doc.content : marked.parse(doc.content);
  const html = isHtml
    ? parsedHtml
    : parsedHtml.replace(/<(h[1-4])(?=[^>]*>)((?:(?!\bid=)[^>])*)>(.*?)<\/\1>/gi, (match, tag, attrs, text) => {
      if (match.includes('id=')) return match;
      const id = text.toLowerCase().replace(/<[^>]+>/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      return `<${tag}${attrs} id="${id}">${text}</${tag}>`;
    });

  const tocHtml = tocVisible && !isHtml ? generateTocHtml(doc.content, false) : '';

  if (isHtml) {
    main.style.padding = '0';
    main.style.overflow = 'hidden';
    main.innerHTML = '<iframe class="doc-iframe" id="doc-iframe" title="Document" style="width:100%;height:100%;border:0;display:block;"></iframe>';
    const frame = document.getElementById('doc-iframe');
    frame.srcdoc = doc.content;
    return;
  }

  main.style.padding = '';
  main.style.overflow = '';
  main.innerHTML = `${tocHtml}<div class="content">${html}</div>`;

  document.querySelectorAll('body > .detail-panel').forEach((modal) => modal.remove());
  main.querySelectorAll('script').forEach((oldScript) => {
    const script = document.createElement('script');
    script.textContent = oldScript.textContent;
    oldScript.parentNode.replaceChild(script, oldScript);
  });
  main.querySelectorAll('.detail-panel').forEach((modal) => document.body.appendChild(modal));

  main.querySelectorAll('a[href$=".md"]').forEach((link) => {
    const href = link.getAttribute('href');
    const targetName = href.split('/').pop();
    const targetIndex = DOCUMENTS.findIndex((document) => document.filename === href || document.filename === targetName);
    if (targetIndex === -1) return;
    link.href = 'javascript:void(0)';
    link.onclick = (event) => {
      event.preventDefault();
      selectDocument(targetIndex);
    };
  });

  renderMermaidDiagrams();
}

function renderDiagramsOnly(doc, main) {
  const lines = doc.content.split('\n');
  const diagrams = [];

  for (let i = 0; i < lines.length; i += 1) {
    if (lines[i].trimEnd() !== '```mermaid') continue;

    let heading = '';
    for (let j = i - 1; j >= 0; j -= 1) {
      const headingMatch = lines[j].match(/^(#{1,4})\s+(.+)$/);
      if (headingMatch) {
        heading = headingMatch[2].trim();
        break;
      }
    }

    const codeLines = [];
    i += 1;
    while (i < lines.length && lines[i].trimEnd() !== '```') {
      codeLines.push(lines[i]);
      i += 1;
    }

    const code = codeLines.join('\n');
    const yamlMatch = code.match(/^---[\r\n]+title:\s*(.+?)[\r\n]+---/);
    const diagramTitle = yamlMatch ? yamlMatch[1].trim() : '';
    diagrams.push({ heading, diagramTitle, code });
  }

  if (diagrams.length === 0) {
    main.innerHTML = '<div class="empty-state">No diagrams found in this document</div>';
    return;
  }

  let html = '<div class="content">';
  diagrams.forEach((diagram, index) => {
    const title = diagram.diagramTitle || diagram.heading;
    if (title) html += `<h2>${title}</h2>`;
    html += `<div class="mermaid-container" id="diagonly-${index}"></div>`;
  });
  html += '</div>';
  main.innerHTML = html;

  diagrams.forEach((diagram, index) => {
    const container = document.getElementById(`diagonly-${index}`);
    mermaid.render(`diagonly-svg-${index}`, diagram.code).then((result) => {
      container.innerHTML = result.svg;
    }).catch(() => {
      const errDiv = document.createElement('div');
      errDiv.className = 'mermaid-error';
      errDiv.innerHTML = `<pre>${diagram.code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>`;
      container.replaceWith(errDiv);
    });
  });
}

function renderMermaidDiagrams() {
  let diagramIndex = 0;
  document.querySelectorAll('code.language-mermaid').forEach((block) => {
    const pre = block.parentElement;
    const code = block.textContent;
    const container = document.createElement('div');
    container.className = 'mermaid-container';
    container.id = `mermaid-diagram-${diagramIndex}`;
    diagramIndex += 1;
    pre.parentNode.replaceChild(container, pre);

    mermaid.render(`${container.id}-svg`, code).then((result) => {
      container.innerHTML = result.svg;
    }).catch(() => {
      const errDiv = document.createElement('div');
      errDiv.className = 'mermaid-error';
      errDiv.innerHTML = `<pre>${code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>`;
      container.replaceWith(errDiv);
    });
  });
}

function toggleToc() {
  tocVisible = !tocVisible;
  document.getElementById('btn-toc').classList.toggle('active', tocVisible);
  renderDocument();
}

function toggleDiagrams() {
  diagramsOnly = !diagramsOnly;
  document.getElementById('btn-diagrams').classList.toggle('active', diagramsOnly);
  renderDocument();
}

window.toggleToc = toggleToc;
window.toggleDiagrams = toggleDiagrams;
window.toggleSort = toggleSort;
window.showScreenshot = (nodeId) => {
  const src = SCREENSHOTS[nodeId];
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modal-title');
  const modalBody = document.getElementById('modal-body');
  if (!src) {
    modalTitle.textContent = 'Screenshot not found';
    modalBody.innerHTML = `<p style="color:#a3a3a3;font-size:13px;">No screenshot available for node: ${nodeId}</p>`;
  } else {
    modalTitle.textContent = nodeId;
    modalBody.innerHTML = `<img src="${src}" style="max-width:100%;height:auto;display:block;" />`;
  }
  modal.style.display = 'flex';
};

window.closeModal = (event) => {
  if (event && event.target !== event.currentTarget) return;
  document.getElementById('modal').style.display = 'none';
};

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') {
    document.getElementById('modal').style.display = 'none';
  }
});

populateSidebar();
if (DOCUMENTS.length > 0) selectDocument(0);

  </script>
