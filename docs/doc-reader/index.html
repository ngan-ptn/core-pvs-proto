lassDef admin fill:#F1ECFF,stroke:#7A5A18,stroke-width:1px,color:#0f2633;\n  classDef system fill:#F4F7FA,stroke:#8DB4C0,stroke-width:1px,color:#0f2633;\n  classDef user fill:#FFFFFF,stroke:#C3D6E2,stroke-width:1px,color:#0f2633;\n\n  subgraph Admin\n    direction TB\n    A1[\"Run import\"]\n    A2[\"Review import protocol\"]\n    A3[\"Manage imported codes\"]\n    A4[\"Confirm sync completion\"]\n  end\n\n  subgraph System\n    direction TB\n    S1[\"Execute import and record protocol\"]\n  end\n\n  A1 --> A2\n  A2 --> A3\n  A3 --> A4\n  A4 --> S1\n\n  class A1,A2,A3,A4 admin\n  class S1 system\n```\n\n---\n","mtime":1774236118484.2246,"sourcePath":"/Users/nganpham/Documents/core-pvs-proto/docs/artifacts/FLOW260322-master-user-workflow.md","folder":null,"navLabel":"Master Workflow"},{"filename":"RSYN260320-competitive-landscape.md","content":"# CorePVS --- MVZ Competitive Landscape\n\n## 1. Context\n\nCorePVS positions itself as:\n\n> \"The PVS that masters MVZ complexity --- intelligent, connected,\n> scalable.\"\n\nTraditional German **PVS systems were built for single practices**,\nwhile MVZ organizations operate across multiple locations and\nspecialties. This creates a structural gap between **existing PVS\ncapabilities** and **MVZ operational needs**.\n\n------------------------------------------------------------------------\n\n# 2. Reality of \"MVZ Support\" in Existing PVS\n\nMany vendors claim **MVZ compatibility**, but their support typically\nincludes only:\n\n| Capability | Typical Support |\n|-----------|----------------|\n| Multiple BSNR locations | Yes |\n| Shared patient master data | Partial |\n| Central billing | Yes |\n| User access per location | Yes |\n\nHowever, **true MVZ orchestration is missing**.\n\n| Capability | Existing PVS |\n|-----------|--------------|\n| Cross-location scheduling | ❌ |\n| Shared resource optimization | ❌ |\n| Device capacity balancing | ❌ |\n| Organization dashboards | ❌ |\n| Cross-location analytics | ❌ |\n\nIn practice, **each location still behaves like an independent\npractice**.\n\n------------------------------------------------------------------------\n\n# 3. Architectural Reason (Why Competitors Don't Support MVZ)\n\nLegacy PVS systems were designed around **one practice location\n(BSNR)**.\n\nTypical model:\n\n- Practice\n  - Patient database\n  - Appointment calendar\n  - Billing\n  - Devices\n\nBut MVZ organizations operate differently:\n\n- MVZ organization\n  - Multiple locations\n  - Shared resources (doctors, devices)\n  - Shared patient pool\n\nA real MVZ platform requires an **organization layer above locations**,\nwhich most legacy PVS systems lack.\n\n------------------------------------------------------------------------\n\n# 4. Positioning Matrix\n\nMapping **practice scale vs operational intelligence vs UX capability** reveals a market gap.\n\n| Quadrant | Vendors | UX Model |\n|----------|--------|----------|\n| Single practice / low intelligence | tomedo, Epikur | legacy, dense but rigid |\n| Multi practice / low intelligence | CGM, medatixx | legacy enterprise |\n| Single practice / medium intelligence | T2med | modern but limited |\n| Modern SaaS PVS | Clinicos | clean, low-density, usability-focused |\n| Multi-location orchestration | (empty market space) | (not yet defined — CorePVS opportunity) |\n\n### UX Benchmark Layer (Modern SaaS PVS)\n\nBeyond feature capability, competitors also differ in **interaction model and UX optimization**.\n\nClinicos represents a **modern SaaS PVS baseline**:\n\n| Axis | Strength | Limitation |\n|------|----------|------------|\n| Speed | Easy to learn, clean navigation | Multi-step flows, mouse-heavy interaction |\n| Clarity / Safety | Clean UI, readable forms | Weak state signaling, limited validation logic |\n| Density | Spacious, modern layout | Low information density, excessive scrolling |\n\n### UX Positioning Insight\n\n- Modern SaaS PVS (e.g. Clinicos) optimize for **usability and adoption**\n- Legacy PVS optimize for **compliance and completeness**\n- Neither optimizes for **high-throughput clinical workflows**\n\n### Strategic Implication\n\nCorePVS must differentiate not only by **capabilities**, but by **interaction model**:\n\n- **Speed:** optimize for high-frequency workflows (keyboard-first, inline actions)\n- **Clarity:** explicit system state (traffic-light logic, validation, read-only separation)\n- **Density:** high-information workspace (no scroll for critical workflows on 24” screens)\n\n> This creates a second differentiation layer:\n> not just *what the system can do*, but *how efficiently it enables work at scale*.\n\n------------------------------------------------------------------------\n\n# 5. Operational Intelligence (Simplified Criteria)\n\nOperational intelligence describes **how well the system helps\nunderstand and optimize operations**, not just record data.\n\n### Low Intelligence\n\n- Data stored but little analysis\n- Static reports only\n- Per-location view\n- Decisions done manually\n\n### High Intelligence\n\n- Real-time operational dashboards\n- Cross-location visibility\n- Resource utilization tracking\n- System suggests actions or improvements\n\n| Capability | Low Intelligence | High Intelligence |\n|-----------|------------------|--------------------|\n| Dashboard | none / static | real-time |\n| Organization view | per practice | cross-location |\n| Resource tracking | limited | doctors + devices |\n| Decision support | manual | system suggestions |\n\nMost existing **PVS systems are still in the low-intelligence\ncategory**.\n\n------------------------------------------------------------------------\n\n# 6. Cross-Sector Competitors\n\nClosest competition may come **outside the PVS market**.\n\n| Vendor | System | Strength |\n|--------|--------|----------|\n| Dedalus | ORBIS | Hospital workflow orchestration |\n| Nexus | Nexus HIS | Hospital network operations |\n| Doctolib | Platform | Scheduling & patient routing |\n| Doctena | SaaS scheduling | Appointment optimization |\n\nThese platforms provide **network orchestration**, but lack **certified\nPVS billing capabilities**.\n\n------------------------------------------------------------------------\n\n# 7. Strategic Insight\n\nHealthcare software is currently split into two worlds:\n\n| Domain | Strength |\n|--------|----------|\n| Hospital HIS | Network orchestration |\n| PVS systems | Practice workflows + billing |\n\nMVZ organizations sit **between these two domains**, creating a\nstructural gap.\n\n------------------------------------------------------------------------\n\n# 8. Strategic Positioning for CorePVS\n\nInstead of positioning as **another PVS**, CorePVS can define a new\ncategory:\n\n## MVZ Operating System\n\n| Layer | Capability |\n|-------|------------|\n| Clinical | Documentation, diagnosis, coding |\n| Administrative | Billing, contracts |\n| Operational | Scheduling & resource optimization |\n| Management | Cross-location analytics |\n\n------------------------------------------------------------------------\n\n# 9. Key Answer: Is Cross-Location Orchestration Already Solved?\n\n| Capability | Market Status |\n|------------|---------------|\n| Cross-location patient records | Partial |\n| Cross-location scheduling | Not available |\n| Cross-location resource allocation | Not available |\n| Organization-wide optimization | Not available |\n\n**Conclusion:**\nThe space for **true MVZ orchestration inside a PVS is largely\nunoccupied.**\n\n------------------------------------------------------------------------\n\n# 10. Strategic Risks\n\nFuture competitors may come from **platform companies rather than legacy\nPVS vendors**.\n\n| Player | Risk |\n|--------|------|\n| Doctolib | expanding from scheduling to practice management |\n| Hospital HIS vendors | moving into outpatient networks |\n| Cloud-native PVS startups | modern architectures |\n","mtime":1774232978171.059,"sourcePath":"/Users/nganpham/Documents/core-pvs-proto/docs/discover/RSYN260320-competitive-landscape.md","folder":null,"navLabel":"Discovery"},{"filename":"AUDIT260322-patient-checkin-registration.md","content":"# Audit Flow — Patient Check-In & Registration\n\n## Artifact Info\n- Artifact code: `AUDIT`\n- Date: `260322`\n- Workflow: `Patient Check-In & Registration`\n- Total screens: `6`\n- Reference system: `https://github.com/tini-works/pvs-base-1.git`\n- Step: `CorePVS design pipeline - Step 1 (Audit Flow)`\n\n## Audit scope\n\nThis audit captures the as-is reception/check-in flow implemented in the reference repo, centered on:\n\n- `pkgs/app_mvz/pages/patient-overview/index.tsx`\n- `pkgs/app_mvz/module_patient-overview/PatientOverview.tsx`\n- `pkgs/app_mvz/module_patient-management/card-reader/*`\n- `pkgs/app_mvz/module_patient-overview/patient-overview-synchronise/*`\n- `pkgs/app_mvz/module_patient-management/create-patient-v2/*`\n\nThis is a current-state audit only. It does not inject compliance or redesign.\n\n## 1. Flow summary\n\n```mermaid\nflowchart TD\n    START([\"Patient arrives at reception\"])\n    START --> OVERVIEW[\"Patient Overview\"]\n\n    OVERVIEW -->|\"Read eGK / card event received\"| CARD[\"eGK patient payload loaded\"]\n\n    CARD -->|\"No matched patient\"| NEWDIALOG[\"Create/View Patient dialog<br/>mode: Create new patient\"]\n    CARD -->|\"1 exact match\"| VIEWDIALOG[\"Create/View Patient dialog<br/>mode: View patient\"]\n    CARD -->|\"Multiple or non-exact matches\"| SELECT[\"Select Patient dialog\"]\n\n    NEWDIALOG -->|\"Confirm\"| CREATE[\"Create Patient form\"]\n    NEWDIALOG -->|\"Cancel\"| OVERVIEW\n\n    VIEWDIALOG -->|\"Confirm\"| RECORD[\"Patient record\"]\n    VIEWDIALOG -->|\"Cancel\"| OVERVIEW\n\n    SELECT -->|\"Cancel\"| OVERVIEW\n    SELECT -->|\"Select exact match\"| VIEW2[\"Create/View Patient dialog<br/>mode: View patient\"]\n    SELECT -->|\"Select partial/conflict match\"| SYNC[\"Synchronise patient dialog\"]\n\n    VIEW2 -->|\"Confirm\"| RECORD\n    VIEW2 -->|\"Cancel\"| OVERVIEW\n\n    SYNC -->|\"Update existing patient\"| ROUTE{\"Valid quarter Schein<br/>for card insurance?\"}\n    SYNC -->|\"Create patient from card\"| ROUTE\n    SYNC -->|\"Cancel\"| OVERVIEW\n\n    CREATE -->|\"Save new patient\"| ROUTE\n    CREATE -->|\"Cancel\"| OVERVIEW\n\n    ROUTE -->|\"No\"| SCHEIN[\"Patient record with deep link<br/>#schein or #private\"]\n    ROUTE -->|\"Yes\"| RECORD\n\n    SCHEIN --> DONE([\"Registration ready for consultation / further admin steps\"])\n    RECORD --> DONE\n```\n\n## 2. Screen map\n\n### A. Patient Overview\n\n**Purpose**  \nMain reception entry point for patient lookup, card-read handling, filtering, and routing into registration follow-up actions.\n\n**User actions**\n\n- Open `Patient Overview`\n- Trigger or receive eGK/card read\n- Review patient list and filters\n- Continue from auto-opened dialog after card read\n\n**System actions**\n\n- Listen for `useListenEgkPatientProfile` event\n- Store incoming card patient data\n- Evaluate matched patient count and compare status\n- Open one of three next states: create, view, or select\n\n**States**\n\n- Idle overview\n- Card payload received\n- No match found\n- Single exact match found\n- Multiple / ambiguous matches found\n\n### B. Create/View Patient dialog\n\n**Purpose**  \nSmall decision dialog used after card read to confirm the next step.\n\n**User actions**\n\n- Cancel\n- Confirm `Create new patient`\n- Confirm `View patient`\n\n**System actions**\n\n- Change dialog title/body based on `isCreate`\n- Preload confirm action to either open create flow or route to patient record\n\n**States**\n\n- Create-new mode\n- View-existing mode\n- Closed\n\n### C. Select Patient dialog\n\n**Purpose**  \nResolve ambiguous matching when the card payload returns multiple or non-exact candidate patients.\n\n**User actions**\n\n- Compare card patient row with PVS candidate rows\n- Select one candidate patient\n- Cancel or confirm selection\n\n**System actions**\n\n- Render card data and matched PVS patients side-by-side\n- Carry selected patient into follow-up branch\n- Route exact match back into view flow\n- Route non-exact match into synchronisation flow\n\n**States**\n\n- Candidate selection open\n- Exact candidate selected\n- Conflict candidate selected\n- Closed\n\n### D. Synchronise patient dialog\n\n**Purpose**  \nCompare card data against an existing patient record and let reception update or create from the card payload.\n\n**User actions**\n\n- Review field-by-field comparison\n- Adjust gender when required\n- Cancel\n- Create patient\n- Update patient detail\n\n**System actions**\n\n- Load original patient profile\n- Compare accepted fields across personal, address, and insurance data\n- Reject update when required payload is incomplete\n- Block sync UI for invalid VSD timestamp\n- After save, decide whether to open patient record directly or deep-link into Schein creation\n\n**States**\n\n- Comparison ready\n- Conflict warning shown\n- Invalid VSD timestamp\n- Create pending\n- Update pending\n- Route to record\n- Route to `#schein` / `#private`\n\n### E. Create Patient form\n\n**Purpose**  \nFull patient registration form used when no match exists or the operator decides to create a patient from card data.\n\n**Main sections**\n\n- Generic info\n- Personal info\n- Address info\n- Contact info\n- Insurance info\n- G81 EHIC info\n- Doctor info\n- ePA consent\n- Other info\n- Visit info\n\n**User actions**\n\n- Navigate sections from shortcut menu\n- Edit demographic and address data\n- Add or edit insurance entries\n- Fill EHIC section for public patients\n- Save or cancel\n\n**System actions**\n\n- Hide `G81 EHIC` for private patients\n- Hide patient deletion except for manager-capable edit flows\n- Transform form values before create/update API calls\n- Enforce active insurance requirements for public patients\n- After successful create, route to patient record or Schein entry based on quarter/Schein check\n\n**States**\n\n- Create mode\n- Edit mode\n- Card-read-backed insurance mode\n- Dirty form with leave confirmation\n- Validation errors\n- Save pending\n- Saved\n\n### F. Patient record / Schein entry\n\n**Purpose**  \nPost-registration landing area after create/update/view.\n\n**User actions**\n\n- Enter patient record\n- Continue into Schein creation when deep-linked\n\n**System actions**\n\n- Navigate to `/patients/:id`\n- If no valid current-quarter Schein exists for the card insurance, route to `/patients/:id#schein`\n- If patient type is private, route to `/patients/:id#private`\n- Reload page after routing\n\n**States**\n\n- Record opened\n- Private Schein entry opened\n- Public Schein entry opened\n\n## 3. Journey / state diagram\n\n```mermaid\nstateDiagram-v2\n    [*] --> PatientOverview\n\n    PatientOverview --> CreateDecision: card read + no match\n    PatientOverview --> ViewDecision: card read + exact match\n    PatientOverview --> SelectPatient: card read + ambiguous match\n\n    CreateDecision --> PatientOverview: cancel\n    CreateDecision --> CreatePatient: confirm\n\n    ViewDecision --> PatientOverview: cancel\n    ViewDecision --> PatientRecord: confirm\n\n    SelectPatient --> PatientOverview: cancel\n    SelectPatient --> ViewDecision: selected exact match\n    SelectPatient --> Synchronise: selected non-exact match\n\n    Synchronise --> PatientOverview: cancel\n    Synchronise --> InvalidTimestamp: VSD timestamp invalid\n    Synchronise --> RouteAfterSave: create or update success\n\n    CreatePatient --> PatientOverview: cancel\n    CreatePatient --> RouteAfterSave: create success\n\n    RouteAfterSave --> PatientRecord: valid quarter Schein exists\n    RouteAfterSave --> ScheinEntry: no valid quarter Schein for card insurance\n\n    InvalidTimestamp --> [*]\n    PatientRecord --> [*]\n    ScheinEntry --> [*]\n```\n\n## 4. Branches and edge cases\n\n### Main branches\n\n- **No matched patient from card:** open create dialog, then full create-patient flow\n- **Single exact match:** open confirm-to-view dialog, then route directly into patient record\n- **Multiple or non-exact matches:** force candidate selection before view or sync\n- **Non-exact selected patient:** open synchronisation comparison rather than direct entry\n- **Successful save with missing valid quarter Schein:** route into `#schein` or `#private` instead of plain patient record\n\n### Adjacent downstream flow\n\n- **Waiting room exists as a downstream handoff, not as evidenced core registration path:** after the workflow lands in `Patient record`, the user can add the patient to a waiting room from patient information and the app also exposes a dedicated `/waiting-room` page plus waiting-room APIs\n- **Practical implication:** waiting room should remain connected to this workflow in future design work, but it should be modeled as a post-registration operational handoff unless a tighter direct handoff is evidenced elsewhere\n\n### Edge cases observed in reference\n\n- **Invalid VSD timestamp:** synchronisation dialog is replaced by an error state (`Hoppla`) instead of allowing update\n- **Missing update payload / unresolved required fields:** update is blocked and shows an error; gender can be explicitly edited in the comparison UI\n- **Public patient without active insurance:** create flow fails until at least one active insurance is present\n- **Insurance mismatch in current quarter:** even for an existing patient, a new Schein path is opened when the card insurance does not match a valid current-quarter Schein\n- **Private patient:** `G81 EHIC` section is hidden and post-save routing goes to `#private` when Schein creation is required\n- **Ambiguous matches:** the flow does not auto-resolve; the operator must choose a candidate\n- **Cancel behavior:** dialogs consistently allow returning to the overview without committing registration changes\n\n## 5. Audit conclusion\n\nThe implemented as-is workflow in `https://github.com/tini-works/pvs-base-1.git` is a **match-and-route registration flow**, not a simple linear \"read card -> waiting room\" flow.\n\nThe operational backbone is:\n\n1. receive card data\n2. decide match quality\n3. create, view, or synchronise patient\n4. ensure quarter-appropriate Schein context\n5. enter patient record\n\nTwo important audit findings for downstream design work:\n\n- **Waiting room is present in the reference system, but the evidenced entry point is downstream from `Patient record`** rather than directly inside the audited registration code path\n- **Schein readiness is part of registration completion** because successful create/update may still deep-link into `#schein` / `#private` before the workflow is truly ready for consultation\n\n## 6. Risk note\n\nThere is a modeling risk in either direction:\n\n- **If waiting room is omitted entirely:** later artifacts may miss a real operational handoff that clearly exists in the system\n- **If waiting room is embedded inside the core Step 1 path:** the audit would overstate the evidence from the reference code and blur the boundary between registration completion and post-registration operational handling\n\nFor this reason, the audit treats waiting room as an **adjacent downstream flow** linked from `Patient record`, not as a mandatory branch in the core audited registration flow.\n\n## Reference files\n\n- `pkgs/app_mvz/pages/patient-overview/index.tsx`\n- `pkgs/app_mvz/module_patient-overview/PatientOverview.tsx`\n- `pkgs/app_mvz/module_patient-management/card-reader/create-view-patient-dialog/CreateViewPatientDialog.tsx`\n- `pkgs/app_mvz/module_patient-management/card-reader/select-patient-dialog/SelectPatientDialog.tsx`\n- `pkgs/app_mvz/module_patient-overview/patient-overview-synchronise/index.tsx`\n- `pkgs/app_mvz/module_patient-overview/patient-overview-synchronise/PatientDataComparison.tsx`\n- `pkgs/app_mvz/module_patient-management/create-patient-v2/CreatePatient.tsx`\n- `pkgs/app_mvz/module_patient-management/create-patient-v2/CreatePatientContent.tsx`\n- `pkgs/app_mvz/module_patient-management/create-patient-v2/CreatePatient.helper.ts`\n- `pkgs/app_mvz/module_patient-management/create-patient-v2/CreatePatient.service.ts`\n- `pkgs/app_mvz/module_patient-management/create-patient-v2/Insurance-info-section/InsuranceInfoSection.tsx`\n- `pkgs/app_mvz/module_patient-management/patient-file/patient-information/PatientInformation.tsx`\n- `pkgs/app_mvz/pages/waiting-room.tsx`\n- `pkgs/pvs-hermes/bff/app_mvz_waiting_room.ts`\n- `ext/open-api/plans/planning_v1.md`\n- `testings/tests/mvz.create-patient.spec.ts`\n","mtime":1774235333865.8557,"sourcePath":"/Users/nganpham/Documents/core-pvs-proto/docs/artifacts/AUDIT260322-patient-checkin-registration.md","folder":"Audit Workflow","navLabel":null},{"filename":"AUDIT260322-prescriptions.md","content":"# System Audit — Prescription Flow in `pvs-base-1`\n\n## Artifact Info\n- Artifact code: `AUDIT`\n- Date: `260322`\n- Workflow: `Prescription`\n- Total screens: `10`\n- Reference system: `https://github.com/tini-works/pvs-base-1.git`\n- Audit basis: GitHub repository `https://github.com/tini-works/pvs-base-1.git`\n\n## Reference Set\n- `testings/kit/page-object/mvz/mvz-medication.po.ts`\n- `pkgs/app_mvz/module_medication_kbv/medication/MedicationKBV.tsx`\n- `pkgs/app_mvz/module_medication_kbv/shopping-bag/MedicationShoppingBag.tsx`\n- `docs/api/form-service-payloads.md`\n- `ares/app/mvz/test/app/medicine/medicine_test.go`\n- `pkgs/pvs-hermes/bff/app_mvz_erezept.ts`\n- `ares/app/mvz/api/erezept/erezept.d.go`\n\n## 1. Flow Summary\n\n```mermaid\nflowchart LR\n    A[Patient Record] --> B[Medication Tab]\n    B --> C[Prescribed Medication]\n    C --> D[Search Medication]\n    D --> E[Select Group]\n    E --> F[Select Medication]\n    F --> G[Shopping Bag / Recipe Pool]\n    G --> H[Edit Quantity, Intake Interval, Further Info, As Needed]\n    H --> I{Prescription path}\n\n    I -->|Standard form| J[Prescribe]\n    J --> K[Print Settings / Print Preview]\n    K --> L[Save Prescription Form]\n    L --> M[Timeline Medication Form Detail]\n\n    I -->|E-Rezept| N[Create ERP Bundles]\n    N --> O{Bundle creation successful?}\n    O -->|No| P[Bundle Creation Failed]\n    O -->|Yes| Q[ERP Ready]\n    Q --> R[Sign and Send ERP]\n    R --> S{Transmission result}\n    S -->|Success| T[E-Rezept Sent]\n    S -->|Failure| U[Send Failed / Retry / Abort]\n    T --> V[E-Rezept Status / PDF / Resend / Remove]\n```\n\n## 2. Screen Map With Related Actions And States\n\n### Journey Diagram\n\n```mermaid\nstateDiagram-v2\n    [*] --> Patient_Record\n\n    state \"Patient Record\" as Patient_Record\n    state \"Medication Tab\" as Medication_Tab\n    state \"Prescribed Medication\" as Prescribed_Medication\n    state \"Medication Plan\" as Medication_Plan\n    state \"Shopping Bag / Recipe Pool\" as Shopping_Bag\n    state \"Print Preview / Print Settings\" as Print_Preview\n    state \"ERP Bundle Creation\" as ERP_Bundle\n    state \"E-Rezept Send / Transmission\" as ERP_Send\n    state \"Timeline Medication Form Detail\" as Timeline_Detail\n    state \"E-Rezept List / Retrieval Surface\" as ERP_List\n\n    Patient_Record --> Medication_Tab: open Medication tab\n    Medication_Tab --> Prescribed_Medication: select Prescribed Medication\n    Medication_Tab --> Medication_Plan: select Medication Plan\n    Medication_Plan --> Prescribed_Medication: return to prescribing\n\n    Prescribed_Medication --> Prescribed_Medication: search / group select / medicine select\n    Prescribed_Medication --> Shopping_Bag: add to shopping bag\n\n    Shopping_Bag --> Shopping_Bag: edit quantity / intake / notes / as needed\n    Shopping_Bag --> Print_Preview: Prescribe (standard form path)\n    Shopping_Bag --> ERP_Bundle: create ERP bundles (e-prescription path)\n\n    Print_Preview --> Timeline_Detail: save prescription form\n\n    ERP_Bundle --> ERP_Bundle: bundle creation in progress\n    ERP_Bundle --> ERP_Send: bundle created\n    ERP_Bundle --> Shopping_Bag: bundle creation failed\n\n    ERP_Send --> ERP_Send: sign / send / retry / abort\n    ERP_Send --> ERP_List: send success\n    ERP_Send --> ERP_Bundle: resend preparation\n    ERP_Send --> Shopping_Bag: recoverable correction path\n\n    Timeline_Detail --> Prescribed_Medication: reopen and continue editing\n    ERP_List --> ERP_Send: resend / abort / follow-up transmission action\n    ERP_List --> Prescribed_Medication: reopen related prescription context\n```\n\n### Swimlane Journey\n\n```mermaid\nflowchart LR\n    subgraph ENCOUNTER[\"ENCOUNTER\"]\n        direction TB\n\n        subgraph L1[\"Standard Prescription Path\"]\n            A1[\"S001 Patient Record\"]\n            A2[\"S002 Medication Tab\"]\n            A3[\"S003 Prescribed Medication\"]\n            A4[\"S004 Shopping Bag / Recipe Pool\"]\n            A5[\"S005 Print Preview / Print Settings\"]\n            A6[\"S006 Timeline Medication Form Detail\"]\n            A1 --> A2 --> A3 --> A4 --> A5 --> A6\n        end\n\n        subgraph L2[\"E-Prescription Path\"]\n            B1[\"S003 Prescribed Medication\"]\n            B2[\"S004 Shopping Bag / Recipe Pool\"]\n            B3[\"S007 ERP Bundle Creation\"]\n            B4[\"S008 E-Rezept Send / Transmission\"]\n            B5[\"S009 E-Rezept List / Retrieval Surface\"]\n            B1 --> B2 --> B3 --> B4 --> B5\n        end\n    end\n\n    subgraph WRAPUP[\"WRAP-UP / STATUS\"]\n        direction TB\n\n        subgraph L3[\"Status And Recovery Path\"]\n            C1[\"S009 E-Rezept List / Retrieval Surface\"]\n            C2[\"S008 Retry / Abort / Resend\"]\n            C3[\"S006 Timeline Medication Form Detail\"]\n            C4[\"S003 Reopen Prescription Context\"]\n            C1 --> C2\n            C1 --> C3\n            C2 --> C1\n            C3 --> C4\n        end\n    end\n```\n\n### `Patient Record`\nEntry point where the user reaches the medication workflow.\n\n**User actions**\n- Open patient chart.\n- Open `Medication` tab.\n\n**System actions**\n- Load patient context.\n- Resolve medication-related patient data.\n\n**States**\n- `patient_record_loaded`\n\n### `Medication Tab`\nContainer surface for medication-related work.\n\n**User actions**\n- Switch to `Prescribed Medication`.\n- Switch to `Medication Plan`.\n\n**System actions**\n- Load medication tab data and shared medication context.\n- Fetch predefined medication data and supporting metadata.\n\n**States**\n- `medication_tab_loaded`\n- `prescribed_medication_active`\n- `medication_plan_active`\n\n### `Prescribed Medication`\nPrimary prescribing workspace for search, selection, and current prescription work.\n\n**User actions**\n- Click into the medication search field.\n- Enter search criteria.\n- Select a medication group.\n- Select a trade-name medication or free-text medication.\n- Open secondary detail flows when needed.\n\n**System actions**\n- Search medication database and render grouped results.\n- Load secondary data such as price comparison, alternatives, warnings, hand letters, and MMI status.\n\n**States**\n- `search_idle`\n- `searching`\n- `search_results_loaded`\n- `group_selected`\n- `medicine_selected`\n- `second_layer_open`\n\n### `Medication Plan`\nAdjacent medication-management surface.\n\n**User actions**\n- Review existing medication plan.\n- Switch back to prescribing workspace.\n\n**System actions**\n- Load plan-related medication context.\n\n**States**\n- `medication_plan_active`\n\n### `Shopping Bag / Recipe Pool`\nTemporary working collection of selected medicines and editable prescription details.\n\n**User actions**\n- Add medication to shopping bag.\n- Increase or decrease quantity.\n- Enter intake interval.\n- Enter further information.\n- Toggle `As needed`.\n- Remove individual items.\n- Remove all items.\n- Open `Prescribe`.\n\n**System actions**\n- Add chosen medication into a persisted shopping bag structure.\n- Validate whether a prescription is allowed based on intake interval, quantity, and free-text completeness.\n\n**States**\n- `shopping_bag_empty`\n- `shopping_bag_with_items`\n- `editing_medicine`\n- `missing_intake_interval`\n- `missing_freetext_name`\n- `invalid_quantity`\n- `not_prescribe_able`\n- `prescribe_able`\n- `remove_all_confirm_open`\n\n### `Print Preview / Print Settings`\nForm-oriented prescription review and print/save configuration for the standard prescription path.\n\n**User actions**\n- Review `Print settings`.\n- Save the prescription or form.\n\n**System actions**\n- Generate form payloads for selected prescription type such as `Muster_16`, `Blaues_Rezept`, `Gruenes_Rezept`, `Btm_Rezept`, and `eRezept`.\n- Save or print prescription forms through `/api/app/mvz/form/app/prescribeV2`.\n\n**States**\n- `print_settings_open`\n- `saving_prescription`\n- `prescription_saved`\n\n### `ERP Bundle Creation`\nTransitional flow state for the e-prescription path.\n\n**User actions**\n- Trigger ERP bundle creation from prepared form info.\n\n**System actions**\n- Create bundles from `FormInfos`.\n\n**States**\n- `bundle_creation_in_progress`\n- `bundle_created`\n- `bundle_creation_failed`\n- `erezept_ready_to_sign_send`\n\n### `E-Rezept Send / Transmission`\nDedicated ERP branch for sign, send, retry, and abort behaviors.\n\n**User actions**\n- Sign and send ERP.\n- Retry failed transmission.\n- Abort where supported.\n\n**System actions**\n- Persist e-prescription metadata.\n- Call `PrescribeERP`, `SignAndSendERP`, `ResendERP`, and `GetPdfUrl`.\n- Through companion/TI integration, create, activate, or abort e-prescription tasks against external services.\n\n**States**\n- `erezept_created`\n- `erezept_sent`\n- `erezept_aborted`\n- `erezept_resend_pending`\n- `send_failed`\n\n### `Timeline Medication Form Detail`\nRead-back detail view for saved medication prescription entries.\n\n**User actions**\n- Re-open saved prescription details from timeline or history.\n\n**System actions**\n- Load saved medication form detail.\n\n**States**\n- `timeline_detail_view`\n\n### `E-Rezept List / Retrieval Surface`\nStatus and retrieval surface exposed by E-Rezept APIs for existing items.\n\n**User actions**\n- Review sent status.\n- Open PDF.\n- Resend.\n- Remove items where supported.\n\n**System actions**\n- Expose list, PDF, and status APIs for ERP items.\n\n**States**\n- `erezept_sent`\n- `erezept_removed`\n- `erezept_resend_pending`\n\n## 3. Branches And Edge Cases\n- Standard form prescription vs e-prescription branch split after shopping-bag or form preparation.\n- Medication can be selected as structured catalog entry or free text.\n- Some form types relax validation: green and private prescriptions do not require the same intake-interval rule as other types.\n- Free-text medication requires a name; otherwise prescribing is blocked.\n- Quantity less than `1` blocks prescribing.\n- Shopping bag can be empty, making prescribe actions unavailable.\n- User may remove individual items or clear the whole recipe pool before saving.\n- Search may require group selection before final medicine selection.\n- Alternate detail flows exist through second-layer dialogs, price comparison, alternatives, and warning surfaces.\n- E-prescription bundle creation can fail before sign/send.\n- Sign/send is not represented as a single visible medication-screen step; it branches into a dedicated ERP, API, and companion path.\n- ERP flow supports abort, resend, remove, and PDF retrieval after creation.\n- Tests show support for partial prescription metadata in ERP payloads, even if that is not clearly surfaced in the main UI flow.\n- Status tracking exists at API and domain level for e-prescriptions, but the visible UI flow in the repo is more explicit for save/print than for full submission lifecycle.\n\n## Audit Conclusion\n- The current as-is flow is best described as `search/select/edit -> shopping bag -> prescribe/save/print`, with `bundle/sign/send/status` as an attached downstream branch.\n- If CorePVS wants a seamless doctor-facing prescription experience, the current split between medication authoring and ERP lifecycle needs to be unified into one continuous workflow surface.\n","mtime":1774235333865.63,"sourcePath":"/Users/nganpham/Documents/core-pvs-proto/docs/artifacts/AUDIT260322-prescriptions.md","folder":"Audit Workflow","navLabel":null}];

const THEME_NAME = "classic";

mermaid.initialize({
  startOnLoad: false,
  theme: 'default',

let currentIndex = -1;
let tocVisible = false;
let diagramsOnly = false;
let sortMode = 'modified';
let sortedIndices = [];
const folderState = {};

function buildSortedIndices() {
  sortedIndices = DOCUMENTS.map((_, index) => index);
  if (sortMode === 'name') {
    sortedIndices.sort((a, b) => DOCUMENTS[a].filename.localeCompare(DOCUMENTS[b].filename));
    return;
  }
  sortedIndices.sort((a, b) => DOCUMENTS[b].mtime - DOCUMENTS[a].mtime);
}

function toggleSort() {
  sortMode = sortMode === 'modified' ? 'name' : 'modified';
  document.getElementById('sort-label').textContent = sortMode === 'modified' ? 'Modified' : 'Name';
  populateSidebar();
}

function makeDocButton(docIndex) {
  return makeDocButtonForPlacement(docIndex, 'main');
}

function makeDocButtonForPlacement(docIndex, placement) {
  const doc = DOCUMENTS[docIndex];
  const button = document.createElement('button');
  button.className = doc.folder ? 'doc-item doc-item-nested' : 'doc-item';
  if (placement === 'footer') {
    button.classList.add('doc-item-footer');
  }
  if (docIndex === currentIndex) button.classList.add('active');
  button.textContent = doc.navLabel || doc.filename.replace(/\.md$/i, '').replace(/\.html$/i, '');
  button.title = doc.filename;
  button.onclick = () => selectDocument(docIndex);
  return button;
}

function appendSection(container, section, sectionDocIndices) {
  if (sectionDocIndices.length === 0) return;

  if (section.isSingleItem) {
    container.appendChild(makeDocButtonForPlacement(sectionDocIndices[0], section.placement));
    return;
  }

  const expanded = folderState[section.label] !== false;
  const header = document.createElement('div');
  header.className = 'folder-header';
  if (section.placement === 'footer') {
    header.classList.add('folder-header-footer');
  }
  header.innerHTML = `<span class="folder-toggle">${expanded ? '&#9662;' : '&#9656;'}</span><span class="folder-name">${section.label}</span>`;
  header.onclick = () => {
    folderState[section.label] = !expanded;
    populateSidebar();
  };
  container.appendChild(header);

  if (expanded) {
    sectionDocIndices.forEach((docIndex) => {
      container.appendChild(makeDocButtonForPlacement(docIndex, section.placement));
    });
  }
}

function populateSidebar() {
  buildSortedIndices();
  const list = document.getElementById('doc-list');
  const footer = document.getElementById('sidebar-footer');
  list.innerHTML = '';
  footer.innerHTML = '';

  NAV_SECTIONS.forEach((section) => {
    const sectionDocIndices = sortedIndices.filter((docIndex) => section.docIndices.includes(docIndex));
    appendSection(section.placement === 'footer' ? footer : list, section, sectionDocIndices);
  });
}

function getInitialDocumentIndex() {
  buildSortedIndices();

  for (const section of NAV_SECTIONS) {
    if (section.placement === 'footer') continue;

    const mainSectionDocIndices = sortedIndices.filter((docIndex) => section.docIndices.includes(docIndex));
    if (mainSectionDocIndices.length > 0) {
      return mainSectionDocIndices[0];
    }
  }

  return -1;
}

function selectDocument(index) {
  currentIndex = index;
  populateSidebar();
  renderDocument();
}

function generateTocHtml(content, isHtml) {
  const items = [];
  let match;

  if (isHtml) {
    const htmlHeadingRegex = /<h([1-4])[^>]*>([\s\S]*?)<\/h\1>/gi;
    match = htmlHeadingRegex.exec(content);
    while (match !== null) {
      const level = Number.parseInt(match[1], 10);
      const text = match[2].replace(/<[^>]+>/g, '').trim();
      const id = text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      items.push({ level, text, id });
      match = htmlHeadingRegex.exec(content);
    }
  } else {
    const headingRegex = /^(#{1,4})\s+(.+)$/gm;
    match = headingRegex.exec(content);
    while (match !== null) {
      const level = match[1].length;
      const text = match[2].trim();
      const id = text.toLowerCase().replace(/<[^>]+>/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      items.push({ level, text, id });
      match = headingRegex.exec(content);
    }
  }

  if (items.length === 0) return '';

  let html = '<div class="toc">';
  html += '<div class="toc-title">Table of Contents</div><ul class="toc-list">';
  items.forEach((item) => {
    html += `<li class="toc-h${item.level}"><a href="#${item.id}">${item.text}</a></li>`;
  });
  html += '</ul></div>';
  return html;
}

function renderDocument() {
  if (currentIndex < 0 || currentIndex >= DOCUMENTS.length) return;

  const doc = DOCUMENTS[currentIndex];
  const main = document.getElementById('main-content');
  const isHtml = doc.filename.toLowerCase().endsWith('.html');

  if (diagramsOnly) {
    renderDiagramsOnly(doc, main);
    return;
  }

  const parsedHtml = isHtml ? doc.content : marked.parse(doc.content);
  const html = isHtml
    ? parsedHtml
    : parsedHtml.replace(/<(h[1-4])(?=[^>]*>)((?:(?!\bid=)[^>])*)>(.*?)<\/\1>/gi, (match, tag, attrs, text) => {
      if (match.includes('id=')) return match;
      const id = text.toLowerCase().replace(/<[^>]+>/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      return `<${tag}${attrs} id="${id}">${text}</${tag}>`;
    });

  const tocHtml = tocVisible && !isHtml ? generateTocHtml(doc.content, false) : '';

  if (isHtml) {
    main.style.padding = '0';
    main.style.overflow = 'hidden';
    main.innerHTML = '<iframe class="doc-iframe" id="doc-iframe" title="Document" style="width:100%;height:100%;border:0;display:block;"></iframe>';
    const frame = document.getElementById('doc-iframe');
    frame.srcdoc = doc.content;
    return;
  }

  main.style.padding = '';
  main.style.overflow = '';
  main.innerHTML = `${tocHtml}<div class="content">${html}</div>`;

  document.querySelectorAll('body > .detail-panel').forEach((modal) => modal.remove());
  main.querySelectorAll('script').forEach((oldScript) => {
    const script = document.createElement('script');
    script.textContent = oldScript.textContent;
    oldScript.parentNode.replaceChild(script, oldScript);
  });
  main.querySelectorAll('.detail-panel').forEach((modal) => document.body.appendChild(modal));

  main.querySelectorAll('a[href$=".md"]').forEach((link) => {
    const href = link.getAttribute('href');
    const targetName = href.split('/').pop();
    const targetIndex = DOCUMENTS.findIndex((document) => document.filename === href || document.filename === targetName);
    if (targetIndex === -1) return;
    link.href = 'javascript:void(0)';
    link.onclick = (event) => {
      event.preventDefault();
      selectDocument(targetIndex);
    };
  });

  renderMermaidDiagrams();
}

function renderDiagramsOnly(doc, main) {
  const lines = doc.content.split('\n');
  const diagrams = [];

  for (let i = 0; i < lines.length; i += 1) {
    if (lines[i].trimEnd() !== '```mermaid') continue;

    let heading = '';
    for (let j = i - 1; j >= 0; j -= 1) {
      const headingMatch = lines[j].match(/^(#{1,4})\s+(.+)$/);
      if (headingMatch) {
        heading = headingMatch[2].trim();
        break;
      }
    }

    const codeLines = [];
    i += 1;
    while (i < lines.length && lines[i].trimEnd() !== '```') {
      codeLines.push(lines[i]);
      i += 1;
    }

    const code = codeLines.join('\n');
    const yamlMatch = code.match(/^---[\r\n]+title:\s*(.+?)[\r\n]+---/);
    const diagramTitle = yamlMatch ? yamlMatch[1].trim() : '';
    diagrams.push({ heading, diagramTitle, code });
  }

  if (diagrams.length === 0) {
    main.innerHTML = '<div class="empty-state">No diagrams found in this document</div>';
    return;
  }

  let html = '<div class="content">';
  diagrams.forEach((diagram, index) => {
    const title = diagram.diagramTitle || diagram.heading;
    if (title) html += `<h2>${title}</h2>`;
    html += `<div class="mermaid-container" id="diagonly-${index}"></div>`;
  });
  html += '</div>';
  main.innerHTML = html;

  diagrams.forEach((diagram, index) => {
    const container = document.getElementById(`diagonly-${index}`);
    mermaid.render(`diagonly-svg-${index}`, diagram.code).then((result) => {
      container.innerHTML = result.svg;
    }).catch(() => {
      const errDiv = document.createElement('div');
      errDiv.className = 'mermaid-error';
      errDiv.innerHTML = `<pre>${diagram.code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>`;
      container.replaceWith(errDiv);
    });
  });
}

function renderMermaidDiagrams() {
  let diagramIndex = 0;
  document.querySelectorAll('code.language-mermaid').forEach((block) => {
    const pre = block.parentElement;
    const code = block.textContent;
    const container = document.createElement('div');
    container.className = 'mermaid-container';
    container.id = `mermaid-diagram-${diagramIndex}`;
    diagramIndex += 1;
    pre.parentNode.replaceChild(container, pre);

    mermaid.render(`${container.id}-svg`, code).then((result) => {
      container.innerHTML = result.svg;
    }).catch(() => {
      const errDiv = document.createElement('div');
      errDiv.className = 'mermaid-error';
      errDiv.innerHTML = `<pre>${code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>`;
      container.replaceWith(errDiv);
    });
  });
}

function toggleToc() {
  tocVisible = !tocVisible;
  document.getElementById('btn-toc').classList.toggle('active', tocVisible);
  renderDocument();
}

function toggleDiagrams() {
  diagramsOnly = !diagramsOnly;
  document.getElementById('btn-diagrams').classList.toggle('active', diagramsOnly);
  renderDocument();

  document.getElementById('modal').style.display = 'none';

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') {
    document.getElementById('modal').style.display = 'none';
  }
});

populateSidebar();
const initialDocumentIndex = getInitialDocumentIndex();
if (initialDocumentIndex !== -1) {
  selectDocument(initialDocumentIndex);
}
